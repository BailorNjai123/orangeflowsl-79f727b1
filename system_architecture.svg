<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="tier1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/><stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="tier2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <linearGradient id="tier3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/><stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title{font-size:24px;font-weight:700;fill:#0f172a}
      .tier{font-size:18px;font-weight:700;fill:#0f172a}
      .lbl{font-size:13px;fill:#0f172a;font-weight:600}
      .sub{font-size:11px;fill:#475569}
      .box{stroke:#cbd5e1;stroke-width:1.5;rx:10;ry:10}
      .line{stroke:#334155;stroke-width:2;fill:none}
      .dash{stroke:#f97316;stroke-width:2;stroke-dasharray:6 4;fill:none}
    </style>
  </defs>

  <rect width="1000" height="720" fill="#ffffff"/>
  <text class="title" x="500" y="38" text-anchor="middle">OrangeFlow — Three-Tier System Architecture</text>

  <!-- Tier 1 -->
  <rect x="40" y="70" width="920" height="170" fill="url(#tier1)" class="box" stroke="#fb923c"/>
  <text class="tier" x="60" y="98">Tier 1 — Presentation Layer</text>
  <g>
    <rect x="70" y="115" width="200" height="105" rx="8" ry="8" fill="#fff" stroke="#fb923c"/>
    <text class="lbl" x="170" y="140" text-anchor="middle">React 18 SPA</text>
    <text class="sub" x="170" y="160" text-anchor="middle">Vite Build</text>
    <text class="sub" x="170" y="178" text-anchor="middle">Tailwind CSS</text>
    <text class="sub" x="170" y="196" text-anchor="middle">shadcn/ui</text>

    <rect x="290" y="115" width="200" height="105" rx="8" ry="8" fill="#fff" stroke="#fb923c"/>
    <text class="lbl" x="390" y="140" text-anchor="middle">PWA Service Worker</text>
    <text class="sub" x="390" y="160" text-anchor="middle">Install Prompt</text>
    <text class="sub" x="390" y="178" text-anchor="middle">Auto-update</text>
    <text class="sub" x="390" y="196" text-anchor="middle">Cache-first assets</text>

    <rect x="510" y="115" width="200" height="105" rx="8" ry="8" fill="#fff" stroke="#fb923c"/>
    <text class="lbl" x="610" y="140" text-anchor="middle">Local Cache</text>
    <text class="sub" x="610" y="160" text-anchor="middle">TanStack Query</text>
    <text class="sub" x="610" y="178" text-anchor="middle">30s auto-refresh</text>
    <text class="sub" x="610" y="196" text-anchor="middle">Stale-while-revalidate</text>

    <rect x="730" y="115" width="200" height="105" rx="8" ry="8" fill="#fff" stroke="#fb923c"/>
    <text class="lbl" x="830" y="140" text-anchor="middle">Role Dashboards</text>
    <text class="sub" x="830" y="160" text-anchor="middle">Planning</text>
    <text class="sub" x="830" y="178" text-anchor="middle">Procurement</text>
    <text class="sub" x="830" y="196" text-anchor="middle">Project Admin</text>
  </g>

  <!-- Tier 2 -->
  <rect x="40" y="280" width="920" height="200" fill="url(#tier2)" class="box" stroke="#6366f1"/>
  <text class="tier" x="60" y="308">Tier 2 — API / Middleware Layer</text>
  <g>
    <rect x="70" y="325" width="220" height="130" rx="8" ry="8" fill="#fff" stroke="#6366f1"/>
    <text class="lbl" x="180" y="350" text-anchor="middle">Supabase Client</text>
    <text class="sub" x="180" y="370" text-anchor="middle">JWT Session Auth</text>
    <text class="sub" x="180" y="388" text-anchor="middle">HTTPS Gateway</text>
    <text class="sub" x="180" y="406" text-anchor="middle">PostgREST</text>
    <text class="sub" x="180" y="424" text-anchor="middle">RLS Enforced</text>

    <rect x="310" y="325" width="220" height="130" rx="8" ry="8" fill="#fff" stroke="#6366f1"/>
    <text class="lbl" x="420" y="350" text-anchor="middle">Edge Functions (Deno)</text>
    <text class="sub" x="420" y="370" text-anchor="middle">manage-users</text>
    <text class="sub" x="420" y="388" text-anchor="middle">seed-users</text>
    <text class="sub" x="420" y="406" text-anchor="middle">Service-role only</text>
    <text class="sub" x="420" y="424" text-anchor="middle">Admin lifecycle ops</text>

    <rect x="550" y="325" width="180" height="130" rx="8" ry="8" fill="#fff7ed" stroke="#f97316"/>
    <text class="lbl" x="640" y="350" text-anchor="middle">Offline Queue</text>
    <text class="sub" x="640" y="370" text-anchor="middle">IndexedDB</text>
    <text class="sub" x="640" y="388" text-anchor="middle">idb-keyval</text>
    <text class="sub" x="640" y="406" text-anchor="middle">Replay on reconnect</text>
    <text class="sub" x="640" y="424" text-anchor="middle">useOnlineSync</text>

    <rect x="750" y="325" width="180" height="130" rx="8" ry="8" fill="#fff" stroke="#6366f1"/>
    <text class="lbl" x="840" y="350" text-anchor="middle">Realtime Layer</text>
    <text class="sub" x="840" y="370" text-anchor="middle">Notifications</text>
    <text class="sub" x="840" y="388" text-anchor="middle">Activity events</text>
    <text class="sub" x="840" y="406" text-anchor="middle">Websocket</text>
  </g>

  <!-- Tier 3 -->
  <rect x="40" y="520" width="920" height="170" fill="url(#tier3)" class="box" stroke="#64748b"/>
  <text class="tier" x="60" y="548">Tier 3 — Data Store Layer</text>
  <g>
    <rect x="70" y="565" width="410" height="105" rx="8" ry="8" fill="#fff" stroke="#64748b"/>
    <text class="lbl" x="275" y="590" text-anchor="middle">PostgreSQL (Managed)</text>
    <text class="sub" x="275" y="610" text-anchor="middle">Row-Level Security enabled on all public tables</text>
    <text class="sub" x="275" y="628" text-anchor="middle">profiles · user_roles · sites · procurement_submissions</text>
    <text class="sub" x="275" y="646" text-anchor="middle">procurement_feedback · activity_log · notifications</text>

    <rect x="500" y="565" width="430" height="105" rx="8" ry="8" fill="#fff" stroke="#64748b"/>
    <text class="lbl" x="715" y="590" text-anchor="middle">Cloud Storage Buckets (Private)</text>
    <text class="sub" x="715" y="614" text-anchor="middle">site-documents  •  procurement-documents</text>
    <text class="sub" x="715" y="634" text-anchor="middle">1-hour signed URLs · owner-scoped policies</text>
  </g>

  <!-- connectors -->
  <path class="line" d="M500,240 L500,280" marker-end="url(#arrow)"/>
  <path class="line" d="M500,480 L500,520" marker-end="url(#arrow)"/>
  <path class="dash" d="M640,325 C 640,270 610,240 610,220" marker-end="url(#arrow)"/>
  <text class="sub" x="655" y="270" fill="#c2410c">offline bypass</text>
</svg>
