<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .t{font-size:24px;font-weight:700;fill:#0f172a}
      .n{font-size:13px;fill:#0f172a}
      .proc{fill:#fff;stroke:#475569;stroke-width:1.5;rx:8;ry:8}
      .dec{fill:#fff7ed;stroke:#f97316;stroke-width:1.5}
      .db{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5;rx:6;ry:6}
      .line{stroke:#334155;stroke-width:1.6;fill:none}
      .yes{font-size:11px;fill:#059669;font-weight:600}
      .no{font-size:11px;fill:#dc2626;font-weight:600}
    </style>
  </defs>
  <rect width="1000" height="900" fill="#fff"/>
  <text class="t" x="500" y="38" text-anchor="middle">OrangeFlow — System Flowchart</text>

  <!-- Start -->
  <ellipse cx="500" cy="90" rx="60" ry="24" fill="#0f172a"/>
  <text class="n" x="500" y="95" text-anchor="middle" fill="#fff">Start</text>

  <!-- Auth check diamond -->
  <polygon points="500,140 620,200 500,260 380,200" class="dec"/>
  <text class="n" x="500" y="196" text-anchor="middle">Session</text>
  <text class="n" x="500" y="214" text-anchor="middle">Authenticated?</text>

  <!-- Login path -->
  <rect class="proc" x="150" y="180" width="160" height="44"/>
  <text class="n" x="230" y="207" text-anchor="middle">Redirect → /login</text>
  <rect class="proc" x="150" y="240" width="160" height="44"/>
  <text class="n" x="230" y="267" text-anchor="middle">Authenticate (JWT)</text>

  <!-- Dashboard -->
  <rect class="proc" x="410" y="290" width="180" height="44"/>
  <text class="n" x="500" y="317" text-anchor="middle">Load Role Dashboard</text>

  <!-- Action -->
  <rect class="proc" x="410" y="360" width="180" height="44"/>
  <text class="n" x="500" y="387" text-anchor="middle">User Action Triggered</text>

  <!-- Online? -->
  <polygon points="500,430 620,490 500,550 380,490" class="dec"/>
  <text class="n" x="500" y="486" text-anchor="middle">navigator</text>
  <text class="n" x="500" y="504" text-anchor="middle">.onLine?</text>

  <!-- Online branch -->
  <rect class="proc" x="700" y="470" width="230" height="44"/>
  <text class="n" x="815" y="497" text-anchor="middle">Direct Supabase API Mutation</text>
  <rect class="db" x="700" y="530" width="230" height="40"/>
  <text class="n" x="815" y="555" text-anchor="middle">Update Global State</text>
  <rect class="proc" x="700" y="590" width="230" height="44"/>
  <text class="n" x="815" y="617" text-anchor="middle">Polling Refresh (30s)</text>

  <!-- Offline branch -->
  <rect class="db" x="70" y="470" width="240" height="44"/>
  <text class="n" x="190" y="497" text-anchor="middle">Persist mutation → IndexedDB</text>
  <rect class="proc" x="70" y="530" width="240" height="44"/>
  <text class="n" x="190" y="557" text-anchor="middle">Wait: 'online' event listener</text>
  <rect class="proc" x="70" y="590" width="240" height="44"/>
  <text class="n" x="190" y="617" text-anchor="middle">Replay / drain queue</text>

  <!-- End -->
  <ellipse cx="500" cy="710" rx="70" ry="26" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <ellipse cx="500" cy="710" rx="58" ry="18" fill="#0f172a"/>
  <text class="n" x="500" y="716" text-anchor="middle" fill="#fff">Complete</text>

  <!-- Arrows -->
  <path class="line" d="M500,114 L500,140" marker-end="url(#a)"/>
  <path class="line" d="M380,200 L310,200" marker-end="url(#a)"/>
  <text class="no" x="325" y="192">No</text>
  <path class="line" d="M230,224 L230,240" marker-end="url(#a)"/>
  <path class="line" d="M230,284 C 230,320 380,320 410,312" marker-end="url(#a)"/>
  <path class="line" d="M500,260 L500,290" marker-end="url(#a)"/>
  <text class="yes" x="510" y="278">Yes</text>
  <path class="line" d="M500,334 L500,360" marker-end="url(#a)"/>
  <path class="line" d="M500,404 L500,430" marker-end="url(#a)"/>

  <path class="line" d="M620,490 L700,490" marker-end="url(#a)"/>
  <text class="yes" x="640" y="482">Yes</text>
  <path class="line" d="M380,490 L310,490" marker-end="url(#a)"/>
  <text class="no" x="325" y="482">No</text>

  <path class="line" d="M815,514 L815,530" marker-end="url(#a)"/>
  <path class="line" d="M815,570 L815,590" marker-end="url(#a)"/>
  <path class="line" d="M190,514 L190,530" marker-end="url(#a)"/>
  <path class="line" d="M190,574 L190,590" marker-end="url(#a)"/>

  <path class="line" d="M815,634 C 815,690 570,700 500,690" marker-end="url(#a)"/>
  <path class="line" d="M190,634 C 190,690 430,700 500,690" marker-end="url(#a)"/>
</svg>
