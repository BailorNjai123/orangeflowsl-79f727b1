<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .t{font-size:24px;font-weight:700;fill:#0f172a}
      .lane{font-size:14px;font-weight:700;fill:#0f172a}
      .n{font-size:12px;fill:#0f172a}
      .act{fill:#fff;stroke:#475569;stroke-width:1.5}
      .planning{fill:#fff7ed}
      .procure{fill:#eef2ff}
      .admin{fill:#ecfdf5}
      .line{stroke:#334155;stroke-width:1.6;fill:none}
      .div{stroke:#cbd5e1;stroke-width:1;stroke-dasharray:4 4}
    </style>
  </defs>
  <rect width="1100" height="720" fill="#fff"/>
  <text class="t" x="550" y="36" text-anchor="middle">OrangeFlow — Activity Diagram (Swimlanes)</text>

  <!-- Lanes -->
  <rect x="40" y="70" width="1020" height="200" class="planning" stroke="#fb923c"/>
  <rect x="40" y="270" width="1020" height="200" class="procure" stroke="#6366f1"/>
  <rect x="40" y="470" width="1020" height="200" class="admin" stroke="#10b981"/>
  <text class="lane" x="55" y="95">Planning Team</text>
  <text class="lane" x="55" y="295">Procurement Team</text>
  <text class="lane" x="55" y="495">Project Admin</text>
  <line class="div" x1="200" y1="70" x2="200" y2="670"/>

  <!-- Planning nodes -->
  <circle cx="240" cy="170" r="14" fill="#0f172a"/>
  <rect class="act" x="290" y="150" width="170" height="40" rx="20"/>
  <text class="n" x="375" y="175" text-anchor="middle">Submit Site Proposal</text>
  <rect class="act" x="490" y="150" width="200" height="40" rx="20"/>
  <text class="n" x="590" y="175" text-anchor="middle">Upload → site-documents</text>

  <!-- arrows planning -->
  <path class="line" d="M254,170 L290,170" marker-end="url(#arr)"/>
  <path class="line" d="M460,170 L490,170" marker-end="url(#arr)"/>
  <path class="line" d="M590,190 L590,340" marker-end="url(#arr)"/>

  <!-- Procurement -->
  <rect class="act" x="230" y="350" width="150" height="40" rx="20"/>
  <text class="n" x="305" y="375" text-anchor="middle">Select Site</text>
  <rect class="act" x="410" y="350" width="170" height="40" rx="20"/>
  <text class="n" x="495" y="375" text-anchor="middle">Perform 9-pt Checklist</text>
  <rect class="act" x="610" y="350" width="180" height="40" rx="20"/>
  <text class="n" x="700" y="375" text-anchor="middle">Attach Validation Sheets</text>
  <rect class="act" x="820" y="350" width="160" height="40" rx="20"/>
  <text class="n" x="900" y="375" text-anchor="middle">Save Feedback</text>

  <path class="line" d="M380,370 L410,370" marker-end="url(#arr)"/>
  <path class="line" d="M580,370 L610,370" marker-end="url(#arr)"/>
  <path class="line" d="M790,370 L820,370" marker-end="url(#arr)"/>
  <path class="line" d="M900,390 L900,540" marker-end="url(#arr)"/>

  <!-- back to planning arrow visual -->
  <path class="line" d="M590,340 L305,340 L305,350" marker-end="url(#arr)"/>

  <!-- Admin -->
  <rect class="act" x="240" y="550" width="150" height="40" rx="20"/>
  <text class="n" x="315" y="575" text-anchor="middle">Review State</text>
  <!-- decision diamond -->
  <polygon points="470,570 540,530 610,570 540,610" fill="#fff" stroke="#475569" stroke-width="1.5"/>
  <text class="n" x="540" y="575" text-anchor="middle">Approve?</text>

  <rect class="act" x="670" y="500" width="150" height="40" rx="20"/>
  <text class="n" x="745" y="525" text-anchor="middle">Approve</text>
  <rect class="act" x="670" y="600" width="150" height="40" rx="20"/>
  <text class="n" x="745" y="625" text-anchor="middle">Reject</text>

  <rect class="act" x="850" y="550" width="200" height="40" rx="20"/>
  <text class="n" x="950" y="575" text-anchor="middle">Write Log + Notify Users</text>

  <path class="line" d="M390,570 L470,570" marker-end="url(#arr)"/>
  <path class="line" d="M610,555 L670,525" marker-end="url(#arr)"/>
  <text class="n" x="625" y="530">Yes</text>
  <path class="line" d="M610,590 L670,615" marker-end="url(#arr)"/>
  <text class="n" x="625" y="620">No</text>
  <path class="line" d="M820,520 C 840,520 840,570 850,570" marker-end="url(#arr)"/>
  <path class="line" d="M820,620 C 840,620 840,575 850,575" marker-end="url(#arr)"/>

  <!-- end -->
  <circle cx="950" cy="660" r="14" fill="#fff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="950" cy="660" r="7" fill="#0f172a"/>
  <path class="line" d="M950,590 L950,646" marker-end="url(#arr)"/>
</svg>
