<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <style>
      .h{font-size:18px;font-weight:800;fill:#0f172a}
      .lbl{font-size:10px;font-weight:700;fill:#475569;text-transform:uppercase;letter-spacing:.5px}
      .v{font-size:13px;fill:#0f172a}
      .muted{font-size:12px;fill:#64748b}
      .btn{font-size:12px;font-weight:700;fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <!-- Header -->
  <rect x="0" y="0" width="1200" height="64" fill="#fff" stroke="#e2e8f0"/>
  <rect x="24" y="16" width="32" height="32" rx="8" fill="url(#brand)"/>
  <text class="h" x="68" y="40">OrangeFlow SL · Planning Workspace</text>
  <text class="muted" x="980" y="40">planning@orange.sl</text>
  <circle cx="1150" cy="32" r="16" fill="#fef3c7"/>
  <text x="1150" y="37" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">PE</text>

  <!-- Sidebar -->
  <rect x="0" y="64" width="220" height="656" fill="#0f172a"/>
  <g fill="#cbd5e1" font-size="13">
    <rect x="12" y="88" width="196" height="34" rx="8" fill="#1e293b"/>
    <text x="36" y="110" fill="#fff">＋ New Site Proposal</text>
    <text x="36" y="152">▦ My Submissions</text>
    <text x="36" y="188">✎ Drafts</text>
    <text x="36" y="224">◎ Site Map</text>
  </g>
  <rect x="12" y="660" width="196" height="40" rx="8" fill="#065f46"/>
  <text x="30" y="685" font-size="12" fill="#d1fae5">● Online — Synced</text>

  <!-- Main title -->
  <text class="h" x="248" y="104">New Candidate Site — SL-FT-001</text>
  <rect x="248" y="118" width="96" height="22" rx="11" fill="#fff7ed" stroke="#fdba74"/>
  <text x="296" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">DRAFT</text>

  <!-- Form card -->
  <rect x="248" y="160" width="720" height="500" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text class="h" x="272" y="192" font-size="14">Site Identification &amp; Technical Metadata</text>
  <line x1="272" y1="204" x2="944" y2="204" stroke="#e2e8f0"/>

  <g transform="translate(272,224)">
    <!-- row 1 -->
    <text class="lbl" x="0" y="0">Site ID</text>
    <rect y="10" width="200" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text class="v" x="12" y="32">SL-FT-001</text>
    <text class="lbl" x="220" y="0">Site Name</text>
    <rect x="220" y="10" width="452" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text class="v" x="232" y="32">Tower Hill Hub — Freetown Central</text>

    <!-- row 2 -->
    <text class="lbl" x="0" y="70">Latitude</text>
    <rect y="80" width="200" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text class="v" x="12" y="102">8.4841° N</text>
    <text class="lbl" x="220" y="70">Longitude</text>
    <rect x="220" y="80" width="200" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text class="v" x="232" y="102">-13.2299° W</text>
    <text class="lbl" x="440" y="70">Tower Height (m)</text>
    <rect x="440" y="80" width="232" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text class="v" x="452" y="102">42</text>

    <!-- row 3 -->
    <text class="lbl" x="0" y="140">Power Source</text>
    <rect y="150" width="320" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text class="v" x="12" y="172">Solar (6.4 kW) + Diesel 7.5 kVA</text>
    <text class="lbl" x="340" y="140">District</text>
    <rect x="340" y="150" width="332" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/><text class="v" x="352" y="172">Western Area Urban</text>
  </g>

  <!-- Upload zone -->
  <rect x="272" y="440" width="672" height="140" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-dasharray="6 4"/>
  <text x="608" y="490" text-anchor="middle" font-size="15" font-weight="700" fill="#c2410c">⇪  Drag &amp; drop survey documents</text>
  <text x="608" y="514" text-anchor="middle" class="muted">PDF, DWG, JPG — up to 25 MB per file</text>
  <rect x="512" y="536" width="192" height="30" rx="6" fill="#fff" stroke="#fdba74"/>
  <text x="608" y="556" text-anchor="middle" font-size="12" font-weight="700" fill="#c2410c">Browse files</text>

  <!-- Actions -->
  <rect x="720" y="608" width="112" height="36" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <text x="776" y="632" text-anchor="middle" class="v" font-weight="600">Save Draft</text>
  <rect x="840" y="608" width="220" height="36" rx="8" fill="url(#brand)"/>
  <text class="btn" x="950" y="632" text-anchor="middle">Submit to Procurement →</text>

  <!-- Side info -->
  <rect x="984" y="160" width="192" height="240" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text class="h" x="1000" y="188" font-size="13">Validation</text>
  <text class="v" x="1000" y="216">✓ GPS in Sierra Leone</text>
  <text class="v" x="1000" y="240">✓ Site ID unique</text>
  <text class="v" x="1000" y="264">✓ Height ≤ 60 m</text>
  <text class="v" x="1000" y="288" fill="#c2410c">⚠ 0 files attached</text>
  <text class="muted" x="1000" y="330">Auto-saved: 14:22</text>
</svg>
