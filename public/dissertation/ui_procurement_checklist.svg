  <line x1="44" y1="222" x2="804" y2="222" stroke="#e2e8f0"/>

  <g transform="translate(44,240)">
    <!-- template rows -->
    <!-- row generator -->
    <!-- 1 -->
    <g><rect width="760" height="44" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text class="item" x="16" y="28">1. Land Identified</text>
      <text x="360" y="28" font-size="12" fill="#166534">📎 land_survey.pdf</text>
      <rect x="640" y="10" width="52" height="24" rx="12" fill="#22c55e"/><circle cx="678" cy="22" r="9" fill="#fff"/>
      <text x="712" y="28" font-size="11" font-weight="700" fill="#166534">PASS</text>
    </g>
    <g transform="translate(0,52)"><rect width="760" height="44" rx="8" fill="#f0fdf4" stroke="#86efac"/>
      <text class="item" x="16" y="28">2. Ownership Verified</text>
      <text x="360" y="28" font-size="12" fill="#166534">📎 title_deed.pdf</text>
      <rect x="640" y="10" width="52" height="24" rx="12" fill="#22c55e"/><circle cx="678" cy="22" r="9" fill="#fff"/>
      <text x="712" y="28" font-size="11" font-weight="700" fill="#166534">PASS</text>
    </g>
    <g transform="translate(0,104)"><rect width="760" height="44" rx="8" fill="#f0fdf4" stroke="#86efac"/>
