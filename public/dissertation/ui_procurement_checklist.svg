  <text class="h" x="864" y="210" font-size="14">Document Viewer</text>
  <rect x="864" y="226" width="292" height="200" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="1010" y="322" text-anchor="middle" font-size="36" fill="#94a3b8">📄</text>
  <text x="1010" y="352" text-anchor="middle" class="v" font-weight="700">lease_executed.pdf</text>
  <text x="1010" y="372" text-anchor="middle" class="muted">2.1 MB · signed 12 Mar</text>
  <rect x="864" y="444" width="140" height="34" rx="6" fill="#fff" stroke="#cbd5e1"/>
  <text x="934" y="466" text-anchor="middle" class="v" font-weight="600">⬇ Download</text>
  <rect x="1016" y="444" width="140" height="34" rx="6" fill="#0f172a"/>
  <text x="1086" y="466" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Open Preview</text>

  <rect x="844" y="528" width="332" height="164" rx="12" fill="#fff" stroke="#e2e8f0"/>
