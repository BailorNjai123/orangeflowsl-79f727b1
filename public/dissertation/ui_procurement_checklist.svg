  <rect x="864" y="568" width="292" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="876" y="590" font-size="11" fill="#64748b">Road access confirmation still</text>
  <text x="876" y="606" font-size="11" fill="#64748b">outstanding — please supply the</text>
  <text x="876" y="622" font-size="11" fill="#64748b">Ministry of Works permit.</text>
  <rect x="1016" y="656" width="140" height="30" rx="6" fill="url(#brand)"/>
  <text x="1086" y="676" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Send Feedback</text>
