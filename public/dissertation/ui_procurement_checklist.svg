      <text x="360" y="28" font-size="12" fill="#991b1b">Awaiting HUAWEI signature</text>
      <rect x="640" y="10" width="52" height="24" rx="12" fill="#e2e8f0"/><circle cx="654" cy="22" r="9" fill="#fff"/>
      <text x="712" y="28" font-size="11" font-weight="700" fill="#991b1b">OPEN</text>
    </g>
