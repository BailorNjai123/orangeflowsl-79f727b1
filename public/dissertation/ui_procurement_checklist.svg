<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <style>
      .h{font-size:18px;font-weight:800;fill:#0f172a}
      .v{font-size:13px;fill:#0f172a}
      .muted{font-size:12px;fill:#64748b}
      .item{font-size:13px;font-weight:600;fill:#0f172a}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="64" fill="#fff" stroke="#e2e8f0"/>
  <rect x="24" y="16" width="32" height="32" rx="8" fill="url(#brand)"/>
  <text class="h" x="68" y="40">OrangeFlow SL · Procurement Audit</text>
  <text class="muted" x="960" y="40">procurement@orange.sl</text>

  <!-- Site header -->
  <rect x="24" y="88" width="1152" height="72" rx="12" fill="#fff" stroke="#e2e8f0"/>
  <text class="h" x="44" y="120">SL-FT-001 · Tower Hill Hub</text>
  <text class="muted" x="44" y="142">Submitted by Planning · Western Area Urban · Received 2h ago</text>
  <rect x="1000" y="108" width="152" height="32" rx="16" fill="#fef3c7" stroke="#fbbf24"/>
  <text x="1076" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">PENDING REVIEW</text>

  <!-- Checklist -->
