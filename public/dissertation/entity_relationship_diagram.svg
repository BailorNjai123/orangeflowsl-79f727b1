<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .t{font-size:24px;font-weight:700;fill:#0f172a}
      .th{font-size:13px;font-weight:700;fill:#fff}
      .col{font-size:11px;fill:#0f172a}
      .pk{font-weight:700;fill:#c2410c}
      .fk{font-style:italic;fill:#4338ca}
      .ent{fill:#fff;stroke:#334155;stroke-width:1.5;rx:6;ry:6}
      .hdr{fill:#0f172a}
      .rel{stroke:#334155;stroke-width:1.6;fill:none}
      .lbl{font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect width="1400" height="980" fill="#fff"/>
  <text class="t" x="700" y="34" text-anchor="middle">OrangeFlow — Entity Relationship Diagram (Crow's Foot)</text>

  <!-- profiles -->
  <g>
    <rect class="ent" x="40" y="70" width="220" height="160"/>
    <rect class="hdr" x="40" y="70" width="220" height="28" rx="6"/>
    <text class="th" x="150" y="89" text-anchor="middle">profiles</text>
    <text class="col pk" x="52" y="115">PK id</text>
    <text class="col" x="52" y="133">user_id</text>
    <text class="col" x="52" y="151">full_name · email</text>
    <text class="col" x="52" y="169">department · is_active</text>
    <text class="col" x="52" y="187">created_at</text>
  </g>

  <!-- user_roles -->
  <g>
    <rect class="ent" x="40" y="270" width="220" height="120"/>
    <rect class="hdr" x="40" y="270" width="220" height="28" rx="6"/>
    <text class="th" x="150" y="289" text-anchor="middle">user_roles</text>
    <text class="col pk" x="52" y="315">PK id</text>
    <text class="col fk" x="52" y="333">FK user_id → profiles.id</text>
    <text class="col" x="52" y="351">role (app_role)</text>
  </g>

  <!-- sites -->
  <g>
    <rect class="ent" x="360" y="60" width="280" height="220"/>
    <rect class="hdr" x="360" y="60" width="280" height="28" rx="6"/>
    <text class="th" x="500" y="79" text-anchor="middle">sites</text>
    <text class="col pk" x="372" y="105">PK id</text>
    <text class="col fk" x="372" y="123">FK submitted_by, reviewed_by</text>
    <text class="col" x="372" y="141">site_id_code · site_name</text>
    <text class="col" x="372" y="159">district · status</text>
    <text class="col" x="372" y="177">civil/RF/power/rollout cols</text>
    <text class="col" x="372" y="195">progress_percent</text>
    <text class="col" x="372" y="213">notes · review_notes</text>
    <text class="col" x="372" y="231">created_at · updated_at</text>
  </g>

  <!-- procurement_submissions -->
  <g>
    <rect class="ent" x="760" y="60" width="290" height="180"/>
    <rect class="hdr" x="760" y="60" width="290" height="28" rx="6"/>
    <text class="th" x="905" y="79" text-anchor="middle">procurement_submissions</text>
    <text class="col pk" x="772" y="105">PK id</text>
    <text class="col fk" x="772" y="123">FK site_id → sites.id</text>
    <text class="col fk" x="772" y="141">FK submitted_by → profiles.id</text>
    <text class="col" x="772" y="159">9-pt checklist + doc urls</text>
    <text class="col" x="772" y="177">vendor/PO/delivery fields</text>
    <text class="col" x="772" y="195">status · procurement_status</text>
    <text class="col" x="772" y="213">created_at · updated_at</text>
  </g>

  <!-- procurement_feedback -->
  <g>
    <rect class="ent" x="1120" y="60" width="240" height="160"/>
    <rect class="hdr" x="1120" y="60" width="240" height="28" rx="6"/>
    <text class="th" x="1240" y="79" text-anchor="middle">procurement_feedback</text>
    <text class="col pk" x="1132" y="105">PK id</text>
    <text class="col fk" x="1132" y="123">FK site_id → sites.id</text>
    <text class="col fk" x="1132" y="141">FK user_id → profiles.id</text>
    <text class="col" x="1132" y="159">status (feedback_status)</text>
    <text class="col" x="1132" y="177">feedback_notes</text>
  </g>

  <!-- activity_log -->
  <g>
    <rect class="ent" x="360" y="340" width="280" height="150"/>
    <rect class="hdr" x="360" y="340" width="280" height="28" rx="6"/>
    <text class="th" x="500" y="359" text-anchor="middle">activity_log</text>
    <text class="col pk" x="372" y="385">PK id</text>
    <text class="col fk" x="372" y="403">FK user_id → profiles.id</text>
    <text class="col" x="372" y="421">action · entity_type/id</text>
    <text class="col" x="372" y="439">description · created_at</text>
    <text class="col" x="372" y="457" fill="#dc2626">append-only</text>
  </g>

  <!-- notifications -->
  <g>
    <rect class="ent" x="760" y="280" width="280" height="150"/>
    <rect class="hdr" x="760" y="280" width="280" height="28" rx="6"/>
    <text class="th" x="900" y="299" text-anchor="middle">notifications</text>
    <text class="col pk" x="772" y="325">PK id</text>
    <text class="col fk" x="772" y="343">FK user_id → profiles.id</text>
    <text class="col" x="772" y="361">title · message · type</text>
    <text class="col" x="772" y="379">is_read · link</text>
    <text class="col" x="772" y="397" fill="#dc2626">no DELETE</text>
  </g>

  <!-- deleted_users_archive -->
  <g>
    <rect class="ent" x="40" y="460" width="260" height="170"/>
    <rect class="hdr" x="40" y="460" width="260" height="28" rx="6"/>
    <text class="th" x="170" y="479" text-anchor="middle">deleted_users_archive</text>
    <text class="col pk" x="52" y="505">PK id</text>
    <text class="col" x="52" y="523">original_user_id · email</text>
    <text class="col" x="52" y="541">full_name · role</text>
    <text class="col" x="52" y="559">deleted_by · deleted_at</text>
    <text class="col" x="52" y="577">reason</text>
  </g>

  <!-- security_audit_log -->
  <g>
    <rect class="ent" x="1120" y="280" width="240" height="170"/>
    <rect class="hdr" x="1120" y="280" width="240" height="28" rx="6"/>
    <text class="th" x="1240" y="299" text-anchor="middle">security_audit_log</text>
    <text class="col pk" x="1132" y="325">PK id</text>
    <text class="col" x="1132" y="343">function_name · caller_role</text>
    <text class="col" x="1132" y="361">arguments (jsonb)</text>
    <text class="col" x="1132" y="379">severity · occurred_at</text>
    <text class="col" x="1132" y="397" fill="#dc2626">read-only to admins</text>
  </g>

  <!-- Legend -->
  <g transform="translate(40,660)">
    <rect x="0" y="0" width="320" height="150" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
    <text class="th" x="10" y="24" fill="#0f172a" font-size="13">Legend (Crow's Foot)</text>
    <line x1="10" y1="48" x2="90" y2="48" stroke="#334155" stroke-width="1.6"/>
    <path d="M85,43 L95,48 L85,53 M85,48 L80,43 M85,48 L80,53" stroke="#334155" fill="none"/>
    <text class="col" x="105" y="52">One-to-Many</text>
    <line x1="10" y1="78" x2="90" y2="78" stroke="#334155" stroke-width="1.6"/>
    <circle cx="85" cy="78" r="3" fill="#fff" stroke="#334155"/>
    <text class="col" x="105" y="82">One-to-One (optional)</text>
    <text class="col pk" x="10" y="112">PK  Primary Key</text>
    <text class="col fk" x="10" y="130">FK  Foreign Key</text>
  </g>

  <!-- Relationships -->
  <!-- profiles 1-1 user_roles -->
  <path class="rel" d="M150,230 L150,270"/>
  <circle cx="150" cy="250" r="3" fill="#fff" stroke="#334155"/>
  <text class="lbl" x="160" y="255">1:1</text>

  <!-- profiles 1-* sites (submitted_by) -->
  <path class="rel" d="M260,150 L360,150"/>
  <path d="M355,145 L365,150 L355,155 M355,150 L350,145 M355,150 L350,155" stroke="#334155" fill="none"/>
  <text class="lbl" x="270" y="142">submits</text>

  <!-- sites 1-* procurement_submissions -->
  <path class="rel" d="M640,150 L760,150"/>
  <path d="M755,145 L765,150 L755,155 M755,150 L750,145 M755,150 L750,155" stroke="#334155" fill="none"/>
  <text class="lbl" x="660" y="142">1:N</text>

  <!-- procurement_submissions 1-* procurement_feedback (both keyed by site) -->
  <path class="rel" d="M1050,140 L1120,140"/>
  <path d="M1115,135 L1125,140 L1115,145 M1115,140 L1110,135 M1115,140 L1110,145" stroke="#334155" fill="none"/>
  <text class="lbl" x="1055" y="132">site_id</text>

  <!-- sites 1-* procurement_feedback (direct) -->
  <path class="rel" d="M640,110 C 900,20 1100,20 1240,60"/>
  <path d="M1235,55 L1245,60 L1235,65 M1235,60 L1230,55 M1235,60 L1230,65" stroke="#334155" fill="none"/>
  <text class="lbl" x="900" y="30">sites 1:N feedback</text>

  <!-- profiles 1-* activity_log -->
  <path class="rel" d="M260,190 C 320,190 320,415 360,415"/>
  <path d="M355,410 L365,415 L355,420 M355,415 L350,410 M355,415 L350,420" stroke="#334155" fill="none"/>
  <text class="lbl" x="270" y="330">logs actions</text>

  <!-- profiles 1-* notifications -->
  <path class="rel" d="M260,210 C 700,270 700,320 760,340"/>
  <path d="M755,335 L765,340 L755,345 M755,340 L750,335 M755,340 L750,345" stroke="#334155" fill="none"/>
  <text class="lbl" x="600" y="280">receives</text>

  <!-- profiles 1-* deleted_users_archive -->
  <path class="rel" d="M150,390 L150,460"/>
  <path d="M145,455 L155,460 L145,465 M145,460 L140,455 M145,460 L140,465" stroke="#334155" fill="none"/>
  <text class="lbl" x="160" y="430">archived from</text>

  <!-- profiles 1-* security_audit_log -->
  <path class="rel" d="M260,180 C 1000,220 1240,250 1240,280"/>
  <path d="M1235,275 L1245,280 L1235,285 M1235,280 L1230,275 M1235,280 L1230,285" stroke="#334155" fill="none"/>
  <text class="lbl" x="900" y="215">audited caller</text>
</svg>
