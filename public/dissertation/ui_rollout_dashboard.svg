<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 940" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .title{font-size:20px;font-weight:700;fill:#0f172a}
      .box{fill:#fff;stroke:#e2e8f0;stroke-width:1.3;rx:8;ry:8}
      .lbl{font-size:12px;fill:#0f172a;font-weight:700}
      .sub{font-size:10px;fill:#64748b}
      .kpi{font-size:22px;font-weight:700;fill:#0f172a}
      .navitem{font-size:11.5px;fill:#e2e8f0}
      .navactive{font-size:11.5px;fill:#fff;font-weight:700}
    </style>
  </defs>
  <rect width="1200" height="940" fill="#ffffff"/>
  <text class="title" x="600" y="30" text-anchor="middle">OrangeFlow SL — Rollout Dashboard (UI Mock-up)</text>

  <!-- Browser frame -->
  <rect x="40" y="55" width="1120" height="855" rx="10" ry="10" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="40" y="55" width="1120" height="34" rx="10" ry="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="60" cy="72" r="5" fill="#f97316"/>
  <circle cx="78" cy="72" r="5" fill="#facc15"/>
  <circle cx="96" cy="72" r="5" fill="#22c55e"/>
  <rect x="130" y="63" width="600" height="18" rx="9" ry="9" fill="#ffffff" stroke="#cbd5e1"/>
  <text style="font-size:10px;fill:#64748b" x="145" y="76">orangeflow.sl/rollout</text>

  <!-- Sidebar -->
  <rect x="40" y="89" width="190" height="821" fill="#0f172a"/>
  <text style="font-size:15px;font-weight:700;fill:#f97316" x="65" y="125">Orange<tspan fill="#fff">Flow</tspan></text>
  <text style="font-size:9px;fill:#94a3b8" x="65" y="140">Rollout Dashboard</text>

  <rect x="55" y="165" width="160" height="34" rx="6" ry="6" fill="#f97316"/>
  <text class="navactive" x="70" y="186">📊  Dashboard</text>
  <rect x="55" y="205" width="160" height="34" rx="6" ry="6" fill="#1e293b"/>
  <text class="navitem" x="70" y="226">✅  Site Feedback</text>
  <rect x="55" y="245" width="160" height="34" rx="6" ry="6" fill="#1e293b"/>
  <text class="navitem" x="70" y="266">📦  Procurement Info</text>
  <rect x="55" y="285" width="160" height="34" rx="6" ry="6" fill="#1e293b"/>
  <text class="navitem" x="70" y="306">🚧  Rollout Form</text>

  <!-- KPI cards -->
  <g>
    <rect x="255" y="105" width="205" height="80" class="box"/>
    <text class="sub" x="270" y="128">Pending Feedback</text>
    <text class="kpi" x="270" y="160" fill="#f97316">12</text>

    <rect x="475" y="105" width="205" height="80" class="box"/>
    <text class="sub" x="490" y="128">Accepted / Active</text>
    <text class="kpi" x="490" y="160" fill="#6366f1">64</text>

    <rect x="695" y="105" width="205" height="80" class="box"/>
    <text class="sub" x="710" y="128">Rejected</text>
    <text class="kpi" x="710" y="160" fill="#dc2626">5</text>

    <rect x="915" y="105" width="220" height="80" class="box"/>
    <text class="sub" x="930" y="128">On Air</text>
    <text class="kpi" x="930" y="160" fill="#16a34a">41</text>
  </g>

  <!-- Procurement Readiness Tracker -->
  <rect x="255" y="200" width="880" height="215" class="box"/>
  <text class="lbl" x="270" y="222">Procurement Readiness — BTS-BO-027</text>

  <rect x="270" y="235" width="270" height="70" rx="6" ry="6" fill="#fff7ed" stroke="#f97316"/>
  <text class="lbl" x="285" y="255" style="font-size:11px">Land Acquisition</text>
  <text style="font-size:18px;font-weight:700;fill:#f97316" x="285" y="280">3/3 ✓</text>

  <rect x="555" y="235" width="270" height="70" rx="6" ry="6" fill="#eef2ff" stroke="#6366f1"/>
  <text class="lbl" x="570" y="255" style="font-size:11px">Land Lease</text>
  <text style="font-size:18px;font-weight:700;fill:#6366f1" x="570" y="280">2/3</text>

  <rect x="840" y="235" width="260" height="70" rx="6" ry="6" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="lbl" x="855" y="255" style="font-size:11px">Handover</text>
  <text style="font-size:18px;font-weight:700;fill:#16a34a" x="855" y="280">4/4 ✓</text>

  <text class="lbl" x="270" y="330" style="font-size:11px">Document Matrix</text>
  <line x1="270" y1="340" x2="1105" y2="340" stroke="#e2e8f0"/>
  <text class="sub" x="280" y="358">Land Identification / Survey</text>
  <text style="font-size:10px;fill:#6366f1" x="700" y="358">View / Download</text>
  <text class="sub" x="280" y="380">Signed Lease Agreement</text>
  <rect x="690" y="368" width="90" height="18" rx="9" ry="9" fill="#f1f5f9" stroke="#94a3b8"/>
  <text style="font-size:9px;fill:#475569" x="702" y="381">Status Only</text>
  <text class="sub" x="900" y="380">Restricted — Procurement-owned</text>

  <!-- Rollout Form -->
  <rect x="255" y="425" width="880" height="470" class="box"/>
  <text class="lbl" x="270" y="450">Rollout Form — Deployment Milestones</text>

  <!-- progress bar -->
  <rect x="270" y="462" width="850" height="16" rx="8" ry="8" fill="#f1f5f9"/>
  <rect x="270" y="462" width="500" height="16" rx="8" ry="8" fill="#f97316"/>
  <text style="font-size:10px;fill:#fff;font-weight:700" x="500" y="474">59% complete</text>

  <!-- 7 milestones -->
  <g style="font-size:10px">
    <rect x="270" y="495" width="115" height="55" rx="6" ry="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="sub" x="280" y="512">Handover to</text><text class="sub" x="280" y="524">Vendor</text>
    <text style="fill:#16a34a;font-weight:700" x="280" y="542">✓ Done</text>

    <rect x="395" y="495" width="115" height="55" rx="6" ry="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="sub" x="405" y="512">Soil Test</text>
    <text style="fill:#16a34a;font-weight:700" x="405" y="542">✓ Done</text>

    <rect x="520" y="495" width="115" height="55" rx="6" ry="6" fill="#f0fdf4" stroke="#16a34a"/>
    <text class="sub" x="530" y="512">Site Impl.</text><text class="sub" x="530" y="524">Design</text>
    <text style="fill:#16a34a;font-weight:700" x="530" y="542">✓ Done</text>

    <rect x="645" y="495" width="115" height="55" rx="6" ry="6" fill="#fff7ed" stroke="#f97316"/>
    <text class="sub" x="655" y="512">Cast Status</text>
    <text style="fill:#f97316;font-weight:700" x="655" y="542">In Progress</text>

    <rect x="770" y="495" width="115" height="55" rx="6" ry="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text class="sub" x="780" y="512">Tower Rig</text>
    <text style="fill:#64748b;font-weight:700" x="780" y="542">Pending</text>

    <rect x="895" y="495" width="110" height="55" rx="6" ry="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text class="sub" x="905" y="512">Civil RFI</text>
    <text style="fill:#64748b;font-weight:700" x="905" y="542">Pending</text>

    <rect x="1015" y="495" width="105" height="55" rx="6" ry="6" fill="#f1f5f9" stroke="#94a3b8"/>
    <text class="sub" x="1025" y="512">Power RFI /</text><text class="sub" x="1025" y="524">On Air</text>
    <text style="fill:#64748b;font-weight:700" x="1025" y="542">Pending</text>
  </g>

  <!-- Verification documents -->
  <text class="lbl" x="270" y="580">Site Verification Documents</text>
  <g>
    <rect x="270" y="595" width="200" height="90" rx="6" ry="6" fill="#fff" stroke="#e2e8f0"/>
    <text class="sub" x="283" y="614">📷 Foundation Photo</text>
    <rect x="283" y="625" width="70" height="18" rx="4" ry="4" fill="#eef2ff" stroke="#6366f1"/>
    <text style="font-size:9px;fill:#4338ca" x="292" y="638">Uploaded</text>

    <rect x="490" y="595" width="200" height="90" rx="6" ry="6" fill="#fff" stroke="#e2e8f0"/>
    <text class="sub" x="503" y="614">📷 Tower Erection Photo</text>
    <rect x="503" y="625" width="70" height="18" rx="4" ry="4" fill="#eef2ff" stroke="#6366f1"/>
    <text style="font-size:9px;fill:#4338ca" x="512" y="638">Uploaded</text>

    <rect x="710" y="595" width="200" height="90" rx="6" ry="6" fill="#fff" stroke="#e2e8f0"/>
    <text class="sub" x="723" y="614">📄 Civil RFI Certificate</text>
    <rect x="723" y="625" width="90" height="18" rx="4" ry="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text style="font-size:9px;fill:#475569" x="732" y="638">Awaiting upload</text>

    <rect x="930" y="595" width="195" height="90" rx="6" ry="6" fill="#fff" stroke="#e2e8f0"/>
    <text class="sub" x="943" y="614">📄 Handover Sign-off</text>
    <rect x="943" y="625" width="90" height="18" rx="4" ry="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text style="font-size:9px;fill:#475569" x="952" y="638">Awaiting upload</text>
  </g>

  <text class="sub" x="270" y="720">Section 1: Project Information · Section 3: Execution Schedule (7 dates) collapse below the fold in the live app.</text>
</svg>
