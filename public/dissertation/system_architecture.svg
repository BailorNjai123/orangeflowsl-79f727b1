<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'Plus Jakarta Sans', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <!-- OrangeFlow brand palette -->
    <linearGradient id="userGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <linearGradient id="appGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="domainGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="offlineGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#ccfbf1"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="700" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">
    Figure 3.1: High-Level Architecture of the Proposed OrangeFlow System
  </text>
  <line x1="120" y1="48" x2="880" y2="48" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ===== Users ===== -->
  <rect x="430" y="70" width="140" height="54" rx="10" ry="10" fill="url(#userGrad)" stroke="#f97316" stroke-width="2"/>
  <text x="500" y="95" text-anchor="middle" font-size="14" font-weight="700" fill="#1e293b">Users</text>
  <text x="500" y="112" text-anchor="middle" font-size="10" fill="#64748b">Planning · Procurement · Power</text>

  <!-- Arrow: Users → Web App -->
  <line x1="500" y1="124" x2="500" y2="158" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== OrangeFlow Web Application ===== -->
  <rect x="300" y="166" width="400" height="64" rx="12" ry="12" fill="url(#appGrad)" stroke="#f97316" stroke-width="2.5"/>
  <text x="500" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#1e293b">OrangeFlow Web Application</text>
  <text x="500" y="215" text-anchor="middle" font-size="10" fill="#64748b">Role-based dashboards · Offline-first PWA</text>

  <!-- Arrow: Web App → Domains -->
  <line x1="500" y1="230" x2="500" y2="264" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Main Domain Boxes ===== -->
  <g>
    <!-- Planning -->
    <rect x="60" y="276" width="140" height="64" rx="8" ry="8" fill="url(#domainGrad)" stroke="#f97316" stroke-width="1.5"/>
    <text x="130" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Planning</text>
    <text x="130" y="323" text-anchor="middle" font-size="9" fill="#64748b">Site parameters</text>

    <!-- Procurement -->
    <rect x="240" y="276" width="140" height="64" rx="8" ry="8" fill="url(#domainGrad)" stroke="#f97316" stroke-width="1.5"/>
    <text x="310" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Procurement</text>
    <text x="310" y="323" text-anchor="middle" font-size="9" fill="#64748b">Land &amp; vendor checks</text>

    <!-- Power -->
    <rect x="420" y="276" width="140" height="64" rx="8" ry="8" fill="url(#domainGrad)" stroke="#f97316" stroke-width="1.5"/>
    <text x="490" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Power</text>
    <text x="490" y="323" text-anchor="middle" font-size="9" fill="#64748b">Energy &amp; certification</text>

    <!-- Rollout -->
    <rect x="600" y="276" width="140" height="64" rx="8" ry="8" fill="url(#domainGrad)" stroke="#f97316" stroke-width="1.5"/>
    <text x="670" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Rollout</text>
    <text x="670" y="323" text-anchor="middle" font-size="9" fill="#64748b">Civil works &amp; milestones</text>

    <!-- Project / Admin -->
    <rect x="780" y="276" width="160" height="64" rx="8" ry="8" fill="url(#domainGrad)" stroke="#f97316" stroke-width="1.5"/>
    <text x="860" y="305" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Project / Admin</text>
    <text x="860" y="323" text-anchor="middle" font-size="9" fill="#64748b">Oversight &amp; approvals</text>
  </g>

  <!-- Workflow arrow: Planning → Procurement → Power → Rollout -->
  <path d="M 200 308 L 240 308" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M 380 308 L 420 308" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)"/>
  <path d="M 560 308 L 600 308" stroke="#f97316" stroke-width="2.5" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="220" y="302" font-size="9" fill="#f97316" font-weight="600">workflow</text>
  <text x="395" y="302" font-size="9" fill="#f97316" font-weight="600">workflow</text>
  <text x="575" y="302" font-size="9" fill="#f97316" font-weight="600">workflow</text>

  <!-- Project/Admin monitoring lines (dashed) to all domains -->
  <line x1="860" y1="276" x2="860" y2="250" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>
  <line x1="840" y1="276" x2="670" y2="252" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>
  <line x1="820" y1="276" x2="490" y2="252" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>
  <line x1="800" y1="276" x2="310" y2="252" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>
  <line x1="780" y1="276" x2="130" y2="252" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>

  <!-- Monitor label -->
  <text x="890" y="240" font-size="9" fill="#64748b" font-weight="600">monitor</text>

  <!-- Arrow: Domains → Backend -->
  <line x1="130" y1="340" x2="130" y2="398" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="310" y1="340" x2="310" y2="398" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="490" y1="340" x2="490" y2="398" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="670" y1="340" x2="670" y2="398" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="860" y1="340" x2="860" y2="398" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== Central Backend / Database ===== -->
  <rect x="260" y="404" width="480" height="64" rx="12" ry="12" fill="url(#backendGrad)" stroke="#64748b" stroke-width="2"/>
  <text x="500" y="430" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Central Backend / Database</text>
  <text x="500" y="450" text-anchor="middle" font-size="10" fill="#64748b">Shared site records · Role-level security · Activity log · Storage</text>

  <!-- ===== Offline Storage &amp; Synchronization (left side) ===== -->
  <rect x="60" y="404" width="160" height="110" rx="10" ry="10" fill="url(#offlineGrad)" stroke="#0d9488" stroke-width="1.5"/>
  <text x="140" y="425" text-anchor="middle" font-size="11" font-weight="700" fill="#134e4a">Offline Storage &amp; Sync</text>

  <!-- Online path -->
  <rect x="72" y="438" width="136" height="28" rx="5" ry="5" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
  <text x="140" y="456" text-anchor="middle" font-size="9" fill="#134e4a">Online → Backend Sync</text>

  <!-- Offline path -->
  <rect x="72" y="474" width="136" height="28" rx="5" ry="5" fill="#ffffff" stroke="#0d9488" stroke-width="1"/>
  <text x="140" y="492" text-anchor="middle" font-size="9" fill="#134e4a">Offline → Local Storage</text>

  <!-- Sync when online -->
  <line x1="220" y1="500" x2="260" y2="500" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="235" y="493" font-size="9" fill="#0d9488" font-weight="600">sync</text>

  <!-- Legend -->
  <g transform="translate(620, 540)">
    <rect x="0" y="0" width="300" height="110" rx="8" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <text x="15" y="22" font-size="11" font-weight="700" fill="#1e293b">Legend</text>
    <line x1="15" y1="35" x2="50" y2="35" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="60" y="39" font-size="10" fill="#475569">General data flow</text>
    <line x1="15" y1="58" x2="50" y2="58" stroke="#f97316" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
    <text x="60" y="62" font-size="10" fill="#475569">Domain workflow</text>
    <line x1="15" y1="81" x2="50" y2="81" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDashed)"/>
    <text x="60" y="85" font-size="10" fill="#475569">Management oversight</text>
    <line x1="15" y1="101" x2="50" y2="101" stroke="#0d9488" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="60" y="105" font-size="10" fill="#475569">Offline synchronisation</text>
  </g>
</svg>
