<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 1180" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
    <style>
      .title{font-size:20px;font-weight:700;fill:#0f172a}
      .actor{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
      .life{stroke:#94a3b8;stroke-width:1.3;stroke-dasharray:4 3}
      .lbl{font-size:11.5px;fill:#0f172a;font-weight:700}
      .msg{stroke:#334155;stroke-width:1.4;fill:none}
      .ret{stroke:#f97316;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
      .mtxt{font-size:9.7px;fill:#0f172a}
      .num{font-size:9px;fill:#64748b}
      .actlog{font-size:9px;fill:#16a34a;font-style:italic}
    </style>
  </defs>
  <rect width="1220" height="1180" fill="#ffffff"/>
  <text class="title" x="610" y="28" text-anchor="middle">OrangeFlow SL — Sequence Diagram: BTS Site Lifecycle</text>

  <!-- Lifelines -->
  <!-- x positions -->
  <!-- Planning 80, Procurement 220, Power 360, Rollout 500, Admin 640, App 830, DB 1050 -->
  <g>
    <rect x="20" y="50" width="120" height="40" class="actor" rx="6" ry="6"/>
    <text class="lbl" x="80" y="75" text-anchor="middle">Planning</text>
    <line x1="80" y1="90" x2="80" y2="1140" class="life"/>

    <rect x="160" y="50" width="120" height="40" class="actor" rx="6" ry="6"/>
    <text class="lbl" x="220" y="75" text-anchor="middle">Procurement</text>
    <line x1="220" y1="90" x2="220" y2="1140" class="life"/>

    <rect x="300" y="50" width="120" height="40" class="actor" rx="6" ry="6"/>
    <text class="lbl" x="360" y="75" text-anchor="middle">Power</text>
    <line x1="360" y1="90" x2="360" y2="1140" class="life"/>

    <rect x="440" y="50" width="120" height="40" class="actor" rx="6" ry="6"/>
    <text class="lbl" x="500" y="75" text-anchor="middle">Rollout</text>
    <line x1="500" y1="90" x2="500" y2="1140" class="life"/>

    <rect x="580" y="50" width="130" height="40" class="actor" rx="6" ry="6"/>
    <text class="lbl" x="645" y="75" text-anchor="middle">Project Admin</text>
    <line x1="645" y1="90" x2="645" y2="1140" class="life"/>

    <rect x="750" y="50" width="200" height="40" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" rx="6" ry="6"/>
    <text class="lbl" x="850" y="70" text-anchor="middle">Application</text>
    <text style="font-size:9px;fill:#7c2d12" x="850" y="84" text-anchor="middle">(PostgREST / RLS)</text>
    <line x1="850" y1="90" x2="850" y2="1140" class="life"/>

    <rect x="990" y="50" width="200" height="40" class="actor" rx="6" ry="6"/>
    <text class="lbl" x="1090" y="70" text-anchor="middle">Database</text>
    <text style="font-size:9px;fill:#3730a3" x="1090" y="84" text-anchor="middle">&amp; Storage</text>
    <line x1="1090" y1="90" x2="1090" y2="1140" class="life"/>
  </g>

  <!-- Messages -->
  <!-- helper: each step y increments by ~45 -->
  <g>
    <text class="num" x="20" y="110">1</text>
    <path class="msg" d="M80,115 L850,115" marker-end="url(#arrow)"/>
    <text class="mtxt" x="230" y="110">submit site plan</text>

    <path class="msg" d="M850,130 L1090,130" marker-end="url(#arrow)"/>
    <text class="mtxt" x="880" y="126">insert sites row</text>
    <path class="ret" d="M1090,142 L850,142" marker-end="url(#arrowOrange)"/>

    <text class="num" x="20" y="160">2</text>
    <path class="msg" d="M850,165 L220,165" marker-end="url(#arrow)"/>
    <text class="mtxt" x="380" y="161">notify admin &amp; procurement</text>
    <path class="msg" d="M850,175 L645,175" marker-end="url(#arrow)"/>

    <text class="num" x="20" y="200">3</text>
    <path class="msg" d="M220,205 L850,205" marker-end="url(#arrow)"/>
    <text class="mtxt" x="300" y="201">procurement feedback: accept</text>

    <text class="num" x="20" y="230">4</text>
    <path class="msg" d="M220,235 L850,235" marker-end="url(#arrow)"/>
    <text class="mtxt" x="240" y="231">nine-point checklist + evidence upload</text>
    <path class="msg" d="M850,248 L1090,248" marker-end="url(#arrow)"/>
    <text class="mtxt" x="900" y="244">store files + rows</text>
    <path class="ret" d="M1090,260 L850,260" marker-end="url(#arrowOrange)"/>

    <text class="num" x="20" y="285">5</text>
    <path class="msg" d="M220,290 L850,290" marker-end="url(#arrow)"/>
    <text class="mtxt" x="260" y="286">procurement release</text>

    <text class="num" x="20" y="315">6</text>
    <path class="msg" d="M850,320 L500,320" marker-end="url(#arrow)"/>
    <text class="mtxt" x="560" y="316">notify rollout &amp; admin</text>
    <path class="msg" d="M850,330 L645,330" marker-end="url(#arrow)"/>

    <text class="num" x="20" y="360">7</text>
    <path class="msg" d="M360,365 L850,365" marker-end="url(#arrow)"/>
    <text class="mtxt" x="380" y="361">power configuration + earthing check</text>

    <text class="num" x="20" y="390">8</text>
    <path class="msg" d="M360,395 L850,395" marker-end="url(#arrow)"/>
    <text class="mtxt" x="400" y="391">power RFI complete</text>
    <path class="msg" d="M850,408 L1090,408" marker-end="url(#arrow)"/>
    <text class="mtxt" x="895" y="404">update power_rfi</text>
    <path class="ret" d="M1090,420 L850,420" marker-end="url(#arrowOrange)"/>

    <text class="num" x="20" y="445">9</text>
    <path class="msg" d="M850,450 L1090,450" marker-end="url(#arrow)"/>
    <text class="mtxt" x="870" y="446">mirror milestone &amp; recompute progress_percent</text>

    <text class="num" x="20" y="480">10</text>
    <path class="msg" d="M500,485 L850,485" marker-end="url(#arrow)"/>
    <text class="mtxt" x="510" y="481">rollout accepts handover</text>

    <text class="num" x="20" y="510">11</text>
    <path class="msg" d="M500,515 L850,515" marker-end="url(#arrow)"/>
    <text class="mtxt" x="380" y="511">rollout form milestones + verification documents</text>
    <path class="msg" d="M850,528 L1090,528" marker-end="url(#arrow)"/>
    <path class="ret" d="M1090,540 L850,540" marker-end="url(#arrowOrange)"/>

    <text class="num" x="20" y="565">12</text>
    <path class="msg" d="M850,570 L500,570" marker-end="url(#arrow)"/>
    <text class="mtxt" x="540" y="566">resubmit (validation failed)</text>
    <path class="msg" d="M500,585 L850,585" marker-end="url(#arrow)"/>
    <text class="mtxt" x="540" y="581">resubmit corrected form</text>

    <text class="num" x="20" y="615">13</text>
    <path class="msg" d="M645,620 L850,620" marker-end="url(#arrow)"/>
    <text class="mtxt" x="655" y="616">admin stage approvals</text>

    <text class="num" x="20" y="645">14</text>
    <path class="msg" d="M645,650 L850,650" marker-end="url(#arrow)"/>
    <text class="mtxt" x="655" y="646">site marked On Air</text>
    <path class="msg" d="M850,663 L1090,663" marker-end="url(#arrow)"/>
    <path class="ret" d="M1090,675 L850,675" marker-end="url(#arrowOrange)"/>
  </g>

  <!-- activity log throughout -->
  <line x1="80" y1="710" x2="1090" y2="710" stroke="#cbd5e1" stroke-dasharray="2 3"/>
  <text class="actlog" x="90" y="730">activity_log entries recorded throughout by the application on every state-changing step (1–14)</text>

  <!-- Legend -->
  <rect x="60" y="760" width="1080" height="120" fill="#f8fafc" stroke="#cbd5e1" rx="8" ry="8"/>
  <text class="lbl" x="80" y="785">Legend</text>
  <path class="msg" d="M80,805 L160,805" marker-end="url(#arrow)"/>
  <text class="mtxt" x="170" y="809">Request / call (solid arrow)</text>
  <path class="ret" d="M80,830 L160,830" marker-end="url(#arrowOrange)"/>
  <text class="mtxt" x="170" y="834">Response / confirmation (dashed orange arrow)</text>
  <text class="actlog" x="80" y="855">Italic green — append-only audit trail entry logged by the Application on the Database</text>
  <text class="mtxt" x="80" y="872">Lifelines: Planning · Procurement · Power · Rollout · Project Admin · Application (PostgREST/RLS) · Database &amp; Storage</text>
</svg>
