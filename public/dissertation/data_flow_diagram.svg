<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Arial, sans-serif">
<style>.p{fill:#fef3c7;stroke:#d97706;stroke-width:2;rx:30;} .e{fill:#e0f2fe;stroke:#0284c7;stroke-width:2;} .d{fill:#f3f4f6;stroke:#6b7280;stroke-width:2;} .t{font-size:12px;fill:#1f2937;} .arr{stroke:#6b7280;stroke-width:1.5;marker-end:url(#b);}</style>
<defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/></marker></defs>
<rect x="20" y="20" width="120" height="50" class="e"/><text x="30" y="50" class="t">Planning Team</text>
