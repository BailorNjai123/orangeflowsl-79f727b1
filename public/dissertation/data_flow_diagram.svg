<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title{font-size:21px;font-weight:700;fill:#0f172a}
      .entity{fill:#eef2ff;stroke:#6366f1;stroke-width:1.5}
      .proc{fill:#fff7ed;stroke:#f97316;stroke-width:1.5}
      .store{fill:#f1f5f9;stroke:#64748b;stroke-width:1.5}
      .lbl{font-size:11.5px;fill:#0f172a;font-weight:600}
      .sub{font-size:9.5px;fill:#475569}
      .flow{stroke:#334155;stroke-width:1.4;fill:none}
      .flbl{font-size:9px;fill:#334155}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#ffffff"/>
  <text class="title" x="600" y="30" text-anchor="middle">OrangeFlow SL — Level-1 Data Flow Diagram</text>

  <!-- External Entities (left column) -->
  <g>
    <rect x="20" y="70" width="150" height="50" class="entity" rx="6" ry="6"/>
    <text class="lbl" x="95" y="100" text-anchor="middle">Planning Officer</text>

    <rect x="20" y="180" width="150" height="50" class="entity" rx="6" ry="6"/>
    <text class="lbl" x="95" y="210" text-anchor="middle">Procurement Officer</text>

    <rect x="20" y="290" width="150" height="50" class="entity" rx="6" ry="6"/>
    <text class="lbl" x="95" y="320" text-anchor="middle">Power Engineer</text>

    <rect x="20" y="400" width="150" height="50" class="entity" rx="6" ry="6"/>
    <text class="lbl" x="95" y="430" text-anchor="middle">Rollout Engineer</text>

    <rect x="20" y="510" width="150" height="50" class="entity" rx="6" ry="6"/>
    <text class="lbl" x="95" y="536" text-anchor="middle">Project</text>
    <text class="lbl" x="95" y="550" text-anchor="middle">Administrator</text>
  </g>

  <!-- Processes (middle column) -->
  <g>
    <circle cx="330" cy="70" r="0" />
    <rect x="260" y="55" width="190" height="60" rx="30" ry="30" class="proc"/>
    <text class="lbl" x="355" y="80" text-anchor="middle">1.0 Authenticate</text>
    <text class="lbl" x="355" y="96" text-anchor="middle">&amp; Authorise</text>

    <rect x="260" y="150" width="190" height="60" rx="30" ry="30" class="proc"/>
    <text class="lbl" x="355" y="175" text-anchor="middle">2.0 Capture</text>
    <text class="lbl" x="355" y="191" text-anchor="middle">Site Plan</text>

    <rect x="260" y="245" width="190" height="60" rx="30" ry="30" class="proc"/>
    <text class="lbl" x="355" y="266" text-anchor="middle">3.0 Process Procurement</text>
    <text class="lbl" x="355" y="282" text-anchor="middle">Compliance</text>

    <rect x="260" y="340" width="190" height="60" rx="30" ry="30" class="proc"/>
    <text class="lbl" x="355" y="361" text-anchor="middle">4.0 Configure Power</text>
    <text class="lbl" x="355" y="377" text-anchor="middle">&amp; Issue RFI</text>

    <rect x="260" y="435" width="190" height="60" rx="30" ry="30" class="proc"/>
    <text class="lbl" x="355" y="456" text-anchor="middle">5.0 Execute Rollout</text>
    <text class="lbl" x="355" y="472" text-anchor="middle">Milestones</text>

    <rect x="260" y="530" width="190" height="60" rx="30" ry="30" class="proc"/>
    <text class="lbl" x="355" y="551" text-anchor="middle">6.0 Supervise, Approve</text>
    <text class="lbl" x="355" y="567" text-anchor="middle">&amp; Report</text>
  </g>

  <!-- Entity to process -->
  <path class="flow" d="M170,95 L260,85" marker-end="url(#arrow)"/>
  <text class="flbl" x="175" y="80">login credentials</text>
  <path class="flow" d="M170,205 C 200,205 200,90 260,80" marker-end="url(#arrow)"/>
  <path class="flow" d="M170,315 C 200,315 200,95 260,90" marker-end="url(#arrow)"/>
  <path class="flow" d="M170,425 C 200,425 200,100 260,95" marker-end="url(#arrow)"/>
  <path class="flow" d="M170,535 C 200,535 200,105 260,100" marker-end="url(#arrow)"/>

  <path class="flow" d="M170,105 C 200,150 220,170 260,180" marker-end="url(#arrow)"/>
  <text class="flbl" x="180" y="150">site plan data</text>

  <path class="flow" d="M170,215 C 210,240 220,265 260,270" marker-end="url(#arrow)"/>
  <text class="flbl" x="180" y="245">checklist + docs</text>

  <path class="flow" d="M170,325 C 210,345 220,360 260,365" marker-end="url(#arrow)"/>
  <text class="flbl" x="180" y="340">power config</text>

  <path class="flow" d="M170,435 C 210,450 220,460 260,460" marker-end="url(#arrow)"/>
  <text class="flbl" x="180" y="435">milestone updates</text>

  <path class="flow" d="M170,545 C 210,555 220,560 260,558" marker-end="url(#arrow)"/>
  <text class="flbl" x="180" y="530">approvals</text>

  <!-- Data stores (right column) -->
  <g>
    <rect x="620" y="40" width="180" height="42" class="store"/>
    <text class="lbl" x="710" y="66" text-anchor="middle">D1 sites</text>

    <rect x="620" y="100" width="180" height="42" class="store"/>
    <text class="lbl" x="710" y="126" text-anchor="middle">D2 procurement_submissions</text>

    <rect x="620" y="160" width="180" height="42" class="store"/>
    <text class="lbl" x="710" y="186" text-anchor="middle">D3 procurement_feedback</text>

    <rect x="620" y="220" width="180" height="42" class="store"/>
    <text class="lbl" x="710" y="246" text-anchor="middle">D4 user_roles / profiles</text>

    <rect x="620" y="280" width="180" height="42" class="store"/>
    <text class="lbl" x="710" y="306" text-anchor="middle">D5 activity_log</text>

    <rect x="620" y="340" width="180" height="42" class="store"/>
    <text class="lbl" x="710" y="366" text-anchor="middle">D6 notifications</text>

    <rect x="620" y="400" width="180" height="42" class="store"/>
    <text class="lbl" x="710" y="426" text-anchor="middle">D7 document storage</text>
  </g>

  <!-- Process <-> store flows -->
  <path class="flow" d="M450,85 C 550,85 570,61 620,61" marker-end="url(#arrow)"/>
  <text class="flbl" x="470" y="70">role check</text>
  <path class="flow" d="M450,180 C 550,120 570,60 620,55" marker-end="url(#arrow)"/>
  <text class="flbl" x="470" y="130">write site record</text>

  <path class="flow" d="M450,265 C 550,265 570,121 620,121" marker-end="url(#arrow)"/>
  <text class="flbl" x="470" y="230">write submission</text>
  <path class="flow" d="M450,280 C 550,280 570,181 620,181" marker-end="url(#arrow)"/>
  <text class="flbl" x="470" y="270">write feedback</text>
  <path class="flow" d="M450,290 C 570,340 590,401 620,411" marker-end="url(#arrow)"/>
  <text class="flbl" x="470" y="345">evidence upload</text>

  <path class="flow" d="M450,360 C 550,360 570,62 620,64" marker-end="url(#arrow)"/>
  <text class="flbl" x="470" y="330">mirror power_rfi</text>

  <path class="flow" d="M450,455 C 550,455 570,68 620,68" marker-end="url(#arrow)"/>
  <text class="flbl" x="470" y="430">update progress</text>

  <path class="flow" d="M450,555 C 550,555 570,241 620,241" marker-end="url(#arrow)"/>
  <text class="flbl" x="470" y="510">verify role/status</text>
  <path class="flow" d="M450,565 C 570,600 590,362 620,362" marker-end="url(#arrow)"/>
  <text class="flbl" x="470" y="590">send notification</text>

  <!-- all processes log activity -->
  <path class="flow" d="M450,95 C 560,180 600,290 620,296" marker-end="url(#arrow)"/>
  <path class="flow" d="M450,190 C 560,220 600,295 620,300" marker-end="url(#arrow)"/>
  <path class="flow" d="M450,275 C 560,285 600,298 620,300" marker-end="url(#arrow)"/>
  <path class="flow" d="M450,375 C 560,340 600,305 620,304" marker-end="url(#arrow)"/>
  <path class="flow" d="M450,465 C 560,400 600,308 620,308" marker-end="url(#arrow)"/>
  <path class="flow" d="M450,560 C 560,450 600,312 620,312" marker-end="url(#arrow)"/>
  <text class="flbl" x="530" y="230">audit entries (all processes)</text>

  <!-- reports to Project Admin -->
  <path class="flow" d="M710,42 C 900,42 900,530 500,555" marker-end="url(#arrow)"/>
  <text class="flbl" x="820" y="35">consolidated status reports</text>

  <!-- Legend -->
  <rect x="880" y="470" width="290" height="150" fill="#f8fafc" stroke="#cbd5e1" rx="8" ry="8"/>
  <text class="lbl" x="900" y="495">Legend</text>
  <rect x="900" y="510" width="24" height="18" class="entity"/>
  <text class="sub" x="932" y="524">External Entity</text>
  <rect x="900" y="536" width="24" height="18" rx="9" ry="9" class="proc"/>
  <text class="sub" x="932" y="550">Process (numbered)</text>
  <rect x="900" y="562" width="24" height="18" class="store"/>
  <text class="sub" x="932" y="576">Data Store (D1–D7)</text>
  <path class="flow" d="M900,596 L924,596" marker-end="url(#arrow)"/>
  <text class="sub" x="932" y="600">Labelled data flow</text>
</svg>
