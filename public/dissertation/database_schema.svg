<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .t{font-size:22px;font-weight:700;fill:#0f172a}
      .h{font-size:13px;font-weight:700;fill:#fff}
      .c{font-size:12px;fill:#0f172a}
      .pk{font-weight:700;fill:#c2410c}
      .fk{font-style:italic;fill:#4338ca}
      .ent{fill:#fff;stroke:#334155;stroke-width:1.5;rx:6;ry:6}
      .hdr{fill:#0f172a}
      .rel{stroke:#475569;stroke-width:1.5;fill:none}
      .lbl{font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect width="1200" height="720" fill="#fff"/>
  <text class="t" x="600" y="34" text-anchor="middle">OrangeFlow — Database Schema</text>

  <g><rect class="ent" x="40" y="80" width="220" height="160"/><rect class="hdr" x="40" y="80" width="220" height="28" rx="6"/><text class="h" x="150" y="99" text-anchor="middle">profiles</text>
    <text class="c pk" x="55" y="128">PK id</text><text class="c" x="55" y="148">user_id (auth)</text><text class="c" x="55" y="168">full_name · email</text><text class="c" x="55" y="188">phone · department</text><text class="c" x="55" y="208">created_at</text>
  </g>
  <g><rect class="ent" x="40" y="300" width="220" height="130"/><rect class="hdr" x="40" y="300" width="220" height="28" rx="6"/><text class="h" x="150" y="319" text-anchor="middle">user_roles</text>
    <text class="c pk" x="55" y="348">PK id</text><text class="c fk" x="55" y="368">FK user_id</text><text class="c" x="55" y="388">role (app_role enum)</text><text class="c" x="55" y="408">created_at</text>
  </g>
  <g><rect class="ent" x="330" y="80" width="260" height="230"/><rect class="hdr" x="330" y="80" width="260" height="28" rx="6"/><text class="h" x="460" y="99" text-anchor="middle">sites</text>
    <text class="c pk" x="345" y="128">PK id</text><text class="c fk" x="345" y="148">FK submitted_by</text>
    <text class="c" x="345" y="168">site_id_code · site_name</text><text class="c" x="345" y="188">scope · district · vendor_name</text>
    <text class="c" x="345" y="208">status · handover_to_vendor</text><text class="c" x="345" y="228">soil_test · site_impl_design</text>
    <text class="c" x="345" y="248">cast_status · tower_rig</text><text class="c" x="345" y="268">civil_rfi · power_rfi · on_air</text>
    <text class="c" x="345" y="288">documents_path · notes</text>
  </g>
  <g><rect class="ent" x="670" y="80" width="260" height="180"/><rect class="hdr" x="670" y="80" width="260" height="28" rx="6"/><text class="h" x="800" y="99" text-anchor="middle">procurement_submissions</text>
    <text class="c pk" x="685" y="128">PK id</text><text class="c fk" x="685" y="148">FK site_id</text><text class="c fk" x="685" y="168">FK submitted_by</text>
    <text class="c" x="685" y="188">9-point checklist fields</text><text class="c" x="685" y="208">status · notes</text>
    <text class="c" x="685" y="228">supporting_docs_path</text><text class="c" x="685" y="248">created_at · updated_at</text>
  </g>
  <g><rect class="ent" x="670" y="320" width="260" height="150"/><rect class="hdr" x="670" y="320" width="260" height="28" rx="6"/><text class="h" x="800" y="339" text-anchor="middle">procurement_feedback</text>
    <text class="c pk" x="685" y="368">PK id</text><text class="c fk" x="685" y="388">FK site_id</text><text class="c fk" x="685" y="408">FK user_id</text>
    <text class="c" x="685" y="428">feedback_text · status</text><text class="c" x="685" y="448">created_at</text>
  </g>
  <g><rect class="ent" x="330" y="380" width="260" height="180"/><rect class="hdr" x="330" y="380" width="260" height="28" rx="6"/><text class="h" x="460" y="399" text-anchor="middle">activity_log</text>
    <text class="c pk" x="345" y="428">PK id</text><text class="c fk" x="345" y="448">FK actor_id</text>
    <text class="c" x="345" y="468">action_type · entity_type</text><text class="c" x="345" y="488">entity_id · description</text>
    <text class="c" x="345" y="508">metadata (jsonb)</text><text class="c" x="345" y="528">created_at</text>
  </g>
  <g><rect class="ent" x="980" y="80" width="200" height="160"/><rect class="hdr" x="980" y="80" width="200" height="28" rx="6"/><text class="h" x="1080" y="99" text-anchor="middle">notifications</text>
    <text class="c pk" x="995" y="128">PK id</text><text class="c fk" x="995" y="148">FK user_id</text>
    <text class="c" x="995" y="168">title · body · type</text><text class="c" x="995" y="188">read (bool) · link</text>
    <text class="c" x="995" y="208">created_at</text>
  </g>
  <g><rect class="ent" x="980" y="300" width="200" height="170"/><rect class="hdr" x="980" y="300" width="200" height="28" rx="6"/><text class="h" x="1080" y="319" text-anchor="middle">deleted_users_archive</text>
    <text class="c pk" x="995" y="348">PK id</text><text class="c" x="995" y="368">original_user_id</text>
    <text class="c" x="995" y="388">full_name · email</text><text class="c" x="995" y="408">role · department</text>
    <text class="c" x="995" y="428">deleted_by · reason</text><text class="c" x="995" y="448">deleted_at</text>
  </g>

  <!-- relationships -->
  <path class="rel" d="M150,240 L150,300"/><text class="lbl" x="160" y="275">1:1</text>
  <path class="rel" d="M260,160 L330,160"/><text class="lbl" x="270" y="152">1:N</text>
  <path class="rel" d="M590,160 L670,160"/><text class="lbl" x="605" y="152">1:N</text>
  <path class="rel" d="M590,240 C 630,240 630,395 670,395"/><text class="lbl" x="605" y="330">1:N</text>
  <path class="rel" d="M260,180 C 300,180 300,450 330,450"/><text class="lbl" x="270" y="320">1:N</text>
  <path class="rel" d="M260,140 C 900,50 950,50 980,140"/><text class="lbl" x="880" y="60">1:N</text>

  <text class="lbl" x="40" y="640">PK Primary Key • FK Foreign Key • Row-Level Security enforced on every table</text>
</svg>
