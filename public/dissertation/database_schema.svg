<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .t{font-size:22px;font-weight:700;fill:#0f172a}
      .h{font-size:13px;font-weight:700;fill:#fff}
      .c{font-size:11px;fill:#0f172a}
      .grp{font-size:10.5px;font-weight:700;fill:#475569}
      .pk{font-weight:700;fill:#c2410c}
      .fk{font-style:italic;fill:#4338ca}
      .ent{fill:#fff;stroke:#334155;stroke-width:1.5;rx:6;ry:6}
      .hdr{fill:#0f172a}
      .note{font-size:11px;fill:#7c2d12}
      .notebox{fill:#fff7ed;stroke:#fdba74;stroke-width:1.3;rx:6;ry:6}
    </style>
  </defs>
  <rect width="1400" height="1120" fill="#fff"/>
  <text class="t" x="700" y="32" text-anchor="middle">OrangeFlow — Database Schema (9 tables)</text>

  <!-- profiles -->
  <g><rect class="ent" x="30" y="60" width="230" height="150"/><rect class="hdr" x="30" y="60" width="230" height="26" rx="6"/><text class="h" x="145" y="78" text-anchor="middle">profiles</text>
    <text class="c pk" x="42" y="102">PK id</text><text class="c" x="42" y="118">user_id (auth)</text><text class="c" x="42" y="134">full_name · email · phone</text><text class="c" x="42" y="150">department · is_active</text><text class="c" x="42" y="166">avatar_url</text><text class="c" x="42" y="182">created_at · updated_at</text>
  </g>

  <!-- user_roles -->
  <g><rect class="ent" x="30" y="230" width="230" height="120"/><rect class="hdr" x="30" y="230" width="230" height="26" rx="6"/><text class="h" x="145" y="248" text-anchor="middle">user_roles</text>
    <text class="c pk" x="42" y="272">PK id</text><text class="c fk" x="42" y="288">FK user_id</text><text class="c" x="42" y="304">role (app_role enum)</text><text class="c" x="42" y="320">unique(user_id, role)</text>
  </g>

  <!-- sites : grouped -->
  <g><rect class="ent" x="300" y="60" width="420" height="700"/><rect class="hdr" x="300" y="60" width="420" height="28" rx="6"/><text class="h" x="510" y="79" text-anchor="middle">sites  (centralised Site ID record, ~90 cols)</text>
    <text class="c pk" x="312" y="105">PK id</text><text class="c fk" x="312" y="121">FK submitted_by, reviewed_by → profiles</text>

    <text class="grp" x="312" y="145">— Identity —</text>
    <text class="c" x="312" y="161">site_name · site_id_code · region</text>
    <text class="c" x="312" y="177">district · town · address</text>
    <text class="c" x="312" y="193">latitude · longitude</text>

    <text class="grp" x="312" y="217">— Civil / Structural —</text>
    <text class="c" x="312" y="233">dimensions · foundation_depth</text>
    <text class="c" x="312" y="249">elevation · terrain_type</text>
    <text class="c" x="312" y="265">access_road_condition</text>
    <text class="c" x="312" y="281">tower_type · tower_material · tower_height</text>

    <text class="grp" x="312" y="305">— RF —</text>
    <text class="c" x="312" y="321">antenna_type · number_of_antennas</text>
    <text class="c" x="312" y="337">transmission_type · distance_nearest_bts</text>

    <text class="grp" x="312" y="361">— Power —</text>
    <text class="c" x="312" y="377">power_source · backup_power</text>
    <text class="c" x="312" y="393">power_backup_type · battery_bank_type</text>
    <text class="c" x="312" y="409">number_of_battery_banks</text>
    <text class="c" x="312" y="425">earthing_resistance (Ω, pass ≤5.0)</text>
    <text class="c" x="312" y="441">grid_transformer_capacity</text>
    <text class="c" x="312" y="457">solar_capacity · generator_capacity</text>
    <text class="c" x="312" y="473">power_rfi_status · power_certificate_url</text>

    <text class="grp" x="312" y="497">— Rollout Milestones —</text>
    <text class="c" x="312" y="513">handover_to_vendor · soil_test</text>
    <text class="c" x="312" y="529">site_implementation_design · cast_status</text>
    <text class="c" x="312" y="545">tower_rig · civil_rfi · power_rfi</text>
    <text class="c" x="312" y="561">on_air · progress_percent</text>

    <text class="grp" x="312" y="585">— Governance —</text>
    <text class="c" x="312" y="601">status (site_status)</text>
    <text class="c" x="312" y="617">submitted_by · reviewed_by</text>
    <text class="c" x="312" y="633">review_notes (jsonb-in-text)</text>
    <text class="c" x="312" y="649">notes (text)</text>
    <text class="c" x="312" y="665">created_at · updated_at</text>

    <rect class="notebox" x="312" y="678" width="396" height="70"/>
    <text class="note" x="322" y="696" font-weight="700">JSON extension note</text>
    <text class="note" x="322" y="712">notes carries a &lt;&lt;PLANNING_JSON&gt;&gt;…&lt;&lt;END&gt;&gt; payload for the</text>
    <text class="note" x="322" y="726">61 extended planning params with no native column;</text>
    <text class="note" x="322" y="740">review_notes merges power / rollout / admin / feedback keys</text>
  </g>

  <!-- procurement_submissions -->
  <g><rect class="ent" x="770" y="60" width="300" height="330"/><rect class="hdr" x="770" y="60" width="300" height="28" rx="6"/><text class="h" x="920" y="79" text-anchor="middle">procurement_submissions</text>
    <text class="c pk" x="782" y="102">PK id</text><text class="c fk" x="782" y="118">FK site_id → sites</text><text class="c fk" x="782" y="134">FK submitted_by → profiles</text>
    <text class="c" x="782" y="154">9-point checklist booleans</text>
    <text class="c" x="782" y="170">+ per-item file URL columns</text>
    <text class="grp" x="782" y="192">Procurement Management</text>
    <text class="c" x="782" y="208">vendor_name · supplier_company</text>
    <text class="c" x="782" y="224">contact_person · phone · email</text>
    <text class="c" x="782" y="240">po_number · po_date · po_status</text>
    <text class="c" x="782" y="256">material_delivery_status</text>
    <text class="c" x="782" y="272">expected/actual_delivery_date</text>
    <text class="c" x="782" y="288">invoice_number · payment_status</text>
    <text class="c" x="782" y="304">procurement_status</text>
    <text class="grp" x="782" y="326">Document Management (6 doc urls)</text>
    <text class="c" x="782" y="342">purchase_order · delivery_note · grn</text>
    <text class="c" x="782" y="358">vendor_delivery_cert · material_handover</text>
    <text class="c" x="782" y="374">material_inspection_report</text>
  </g>

  <!-- procurement_feedback -->
  <g><rect class="ent" x="1110" y="60" width="260" height="150"/><rect class="hdr" x="1110" y="60" width="260" height="28" rx="6"/><text class="h" x="1240" y="79" text-anchor="middle">procurement_feedback</text>
    <text class="c pk" x="1122" y="102">PK id</text><text class="c fk" x="1122" y="118">FK site_id · FK user_id</text>
    <text class="c" x="1122" y="138">status (feedback_status)</text><text class="c" x="1122" y="154">feedback_notes</text><text class="c" x="1122" y="170">created_at</text>
  </g>

  <!-- activity_log -->
  <g><rect class="ent" x="770" y="420" width="260" height="150"/><rect class="hdr" x="770" y="420" width="260" height="28" rx="6"/><text class="h" x="900" y="439" text-anchor="middle">activity_log (append-only)</text>
    <text class="c pk" x="782" y="462">PK id</text><text class="c fk" x="782" y="478">FK user_id</text>
    <text class="c" x="782" y="498">user_name · action</text><text class="c" x="782" y="514">description · entity_type</text><text class="c" x="782" y="530">entity_id · created_at</text>
    <text class="c" x="782" y="546" fill="#dc2626">no UPDATE / DELETE</text>
  </g>

  <!-- notifications -->
  <g><rect class="ent" x="1110" y="240" width="260" height="150"/><rect class="hdr" x="1110" y="240" width="260" height="28" rx="6"/><text class="h" x="1240" y="259" text-anchor="middle">notifications</text>
    <text class="c pk" x="1122" y="282">PK id</text><text class="c fk" x="1122" y="298">FK user_id</text>
    <text class="c" x="1122" y="318">title · message · type</text><text class="c" x="1122" y="334">is_read · link</text><text class="c" x="1122" y="350" fill="#dc2626">no DELETE · created_at</text>
  </g>

  <!-- deleted_users_archive -->
  <g><rect class="ent" x="1110" y="420" width="260" height="180"/><rect class="hdr" x="1110" y="420" width="260" height="28" rx="6"/><text class="h" x="1240" y="439" text-anchor="middle">deleted_users_archive</text>
    <text class="c pk" x="1122" y="462">PK id</text><text class="c" x="1122" y="478">original_user_id · email</text>
    <text class="c" x="1122" y="494">full_name · department · phone</text><text class="c" x="1122" y="510">role · was_active</text>
    <text class="c" x="1122" y="526">deleted_by · deleted_by_name</text><text class="c" x="1122" y="542">deleted_at · reason</text>
  </g>

  <!-- security_audit_log -->
  <g><rect class="ent" x="30" y="800" width="300" height="180"/><rect class="hdr" x="30" y="800" width="300" height="28" rx="6"/><text class="h" x="180" y="819" text-anchor="middle">security_audit_log</text>
    <text class="c pk" x="42" y="842">PK id</text>
    <text class="c" x="42" y="858">function_name · caller_user_id</text><text class="c" x="42" y="874">caller_role · arguments (jsonb)</text>
    <text class="c" x="42" y="890">error_message · error_code</text><text class="c" x="42" y="906">severity · occurred_at</text>
    <text class="c" x="42" y="926" fill="#dc2626">read-only to admins</text>
  </g>

  <!-- relationships -->
  <path d="M145,210 L145,230" stroke="#475569" stroke-width="1.5" fill="none"/><text class="c" x="155" y="224">1:1</text>
  <path d="M260,120 L300,120" stroke="#475569" stroke-width="1.5" fill="none"/><text class="c" x="264" y="112">1:N submits</text>
  <path d="M720,120 L770,120" stroke="#475569" stroke-width="1.5" fill="none"/><text class="c" x="724" y="112">1:N</text>
  <path d="M720,300 C 745,300 745,135 1110,135" stroke="#475569" stroke-width="1.5" fill="none"/><text class="c" x="900" y="120">1:N</text>
  <path d="M260,150 C 280,150 280,500 770,500" stroke="#475569" stroke-width="1.5" fill="none"/><text class="c" x="480" y="510">1:N logs</text>
  <path d="M260,180 C 280,180 280,320 1110,320" stroke="#475569" stroke-width="1.5" fill="none"/><text class="c" x="700" y="200">1:N notifies</text>

  <text class="c" x="30" y="1030">PK Primary Key • FK Foreign Key • Row-Level Security + explicit GRANTs enforced on all 9 tables</text>
  <text class="note" x="30" y="1055">Enums: app_role · site_status(pending/approved/rejected) · feedback_status(pending/accepted/rejected)</text>
</svg>
