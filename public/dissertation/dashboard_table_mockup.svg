<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fb923c"/></linearGradient>
    <style>
      .app{font-size:18px;font-weight:800;fill:#0f172a}
      .h1{font-size:20px;font-weight:700;fill:#0f172a}
      .muted{font-size:12px;fill:#64748b}
      .th{font-size:11px;font-weight:700;fill:#334155;text-transform:uppercase;letter-spacing:.4px}
      .td{font-size:12px;fill:#0f172a}
      .badge{font-size:10px;font-weight:700;fill:#fff}
      .pill{fill:#fff7ed;stroke:#fdba74;stroke-width:1}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="720" fill="#0f172a"/>
  <rect x="24" y="24" width="34" height="34" rx="8" fill="url(#brand)"/>
  <text class="app" x="70" y="47" fill="#fff">OrangeFlow</text>
  <text class="muted" x="70" y="63" fill="#94a3b8">Project Admin</text>

  <g fill="#cbd5e1" font-size="13">
    <rect x="16" y="100" width="188" height="36" rx="8" fill="#1e293b"/>
    <text x="40" y="123" fill="#fff">▦  Dashboard</text>
    <text x="40" y="163">◎  Site Monitor</text>
    <text x="40" y="200">✎  Submissions</text>
    <text x="40" y="237">✓  Approvals</text>
    <text x="40" y="274">☰  Activity Log</text>
    <text x="40" y="311">⚙  Users &amp; Roles</text>
  </g>
  <text x="40" y="690" font-size="11" fill="#64748b">v1.0 • Live Backend</text>

  <!-- Top bar -->
  <rect x="220" y="0" width="1060" height="64" fill="#fff" stroke="#e2e8f0"/>
  <text class="h1" x="248" y="40">Site Monitor</text>
  <rect x="820" y="16" width="280" height="32" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text class="muted" x="838" y="37">🔍  Search sites, ID, district, vendor…</text>
  <rect x="1112" y="16" width="140" height="32" rx="8" fill="url(#brand)"/>
  <text class="badge" x="1182" y="37" text-anchor="middle">+ NEW SITE</text>

  <!-- Filters -->
  <g transform="translate(248,88)">
    <rect width="120" height="32" rx="8" fill="#fff" stroke="#e2e8f0"/><text class="td" x="14" y="22">District ▾</text>
    <rect x="132" width="120" height="32" rx="8" fill="#fff" stroke="#e2e8f0"/><text class="td" x="146" y="22">Status ▾</text>
    <rect x="264" width="120" height="32" rx="8" fill="#fff" stroke="#e2e8f0"/><text class="td" x="278" y="22">Vendor ▾</text>
    <rect x="880" width="132" height="32" rx="8" fill="#fff" stroke="#e2e8f0"/><text class="td" x="898" y="22">⬇  Export CSV</text>
  </g>

  <!-- Table Card -->
  <rect x="248" y="140" width="1000" height="500" rx="12" fill="#fff" stroke="#e2e8f0"/>

  <!-- Header row -->
  <rect x="248" y="140" width="1000" height="44" fill="#f8fafc"/>
  <g>
    <text class="th" x="268" y="167">SN</text>
    <text class="th" x="316" y="167">Site ID</text>
    <text class="th" x="416" y="167">Site</text>
    <text class="th" x="596" y="167">Scope</text>
    <text class="th" x="696" y="167">District</text>
    <text class="th" x="896" y="167">Vendor</text>
    <text class="th" x="1010" y="167">Hardware</text>
    <text class="th" x="1156" y="167">View</text>
  </g>
  <line x1="248" y1="184" x2="1248" y2="184" stroke="#e2e8f0"/>

  <!-- Row 1 -->
  <g transform="translate(0,196)">
    <text class="td" x="268" y="22">1</text>
    <text class="td" x="316" y="22" font-weight="600">SL-FT-001</text>
    <text class="td" x="416" y="22">Tower Hill Hub</text>
    <rect class="pill" x="596" y="6" width="82" height="22" rx="11"/>
    <text class="td" x="637" y="22" text-anchor="middle">New Site</text>
    <text class="td" x="696" y="22">Western Area Urban</text>
    <text class="td" x="896" y="22">HUAWEI</text>
    <rect x="1010" y="6" width="90" height="22" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
    <text class="td" x="1055" y="22" text-anchor="middle" fill="#4338ca">📎 3 files</text>
    <circle cx="1170" cy="17" r="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1170" y="22" text-anchor="middle" font-size="12">👁</text>
  </g>
  <line x1="248" y1="240" x2="1248" y2="240" stroke="#f1f5f9"/>

  <!-- Row 2 -->
  <g transform="translate(0,252)">
    <text class="td" x="268" y="22">2</text>
    <text class="td" x="316" y="22" font-weight="600">SL-KEN-019</text>
    <text class="td" x="416" y="22">Tongo Fields Rural</text>
    <rect class="pill" x="596" y="6" width="82" height="22" rx="11"/>
    <text class="td" x="637" y="22" text-anchor="middle">New Site</text>
    <text class="td" x="696" y="22">Kenema District</text>
    <text class="td" x="896" y="22">HUAWEI</text>
    <rect x="1010" y="6" width="90" height="22" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
    <text class="td" x="1055" y="22" text-anchor="middle" fill="#4338ca">📎 2 files</text>
    <circle cx="1170" cy="17" r="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1170" y="22" text-anchor="middle" font-size="12">👁</text>
  </g>
  <line x1="248" y1="296" x2="1248" y2="296" stroke="#f1f5f9"/>

  <!-- Row 3 -->
  <g transform="translate(0,308)">
    <text class="td" x="268" y="22">3</text>
    <text class="td" x="316" y="22" font-weight="600">SL006</text>
    <text class="td" x="416" y="22">Tower Hill Hub</text>
    <rect class="pill" x="596" y="6" width="82" height="22" rx="11"/>
    <text class="td" x="637" y="22" text-anchor="middle">New Site</text>
    <text class="td" x="696" y="22">Western Area Urban</text>
    <text class="td" x="896" y="22">HUAWEI</text>
    <rect x="1010" y="6" width="90" height="22" rx="6" fill="#eef2ff" stroke="#c7d2fe"/>
    <text class="td" x="1055" y="22" text-anchor="middle" fill="#4338ca">📎 4 files</text>
    <circle cx="1170" cy="17" r="14" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="1170" y="22" text-anchor="middle" font-size="12">👁</text>
  </g>
  <line x1="248" y1="352" x2="1248" y2="352" stroke="#f1f5f9"/>

  <!-- Footer -->
  <text class="muted" x="268" y="620">3 sites shown · Live data via secured API · Row-Level Security enforced</text>
  <g transform="translate(1080,600)">
    <rect width="32" height="28" rx="6" fill="#fff" stroke="#e2e8f0"/><text class="td" x="16" y="19" text-anchor="middle">‹</text>
    <rect x="40" width="32" height="28" rx="6" fill="url(#brand)"/><text class="badge" x="56" y="18" text-anchor="middle">1</text>
    <rect x="80" width="32" height="28" rx="6" fill="#fff" stroke="#e2e8f0"/><text class="td" x="96" y="19" text-anchor="middle">2</text>
    <rect x="120" width="32" height="28" rx="6" fill="#fff" stroke="#e2e8f0"/><text class="td" x="136" y="19" text-anchor="middle">›</text>
  </g>
</svg>
