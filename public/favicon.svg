<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fb923c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#g)"/>
  <!-- BTS Tower -->
  <g fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main tower pole -->
    <line x1="256" y1="100" x2="256" y2="420"/>
    <!-- Tower cross beams -->
    <line x1="200" y1="420" x2="312" y2="420"/>
    <line x1="210" y1="340" x2="302" y2="340"/>
    <line x1="220" y1="260" x2="292" y2="260"/>
    <!-- Diagonal supports -->
    <line x1="200" y1="420" x2="256" y2="260"/>
    <line x1="312" y1="420" x2="256" y2="260"/>
    <!-- Antenna arms -->
    <line x1="256" y1="100" x2="196" y2="140"/>
    <line x1="256" y1="100" x2="316" y2="140"/>
    <line x1="256" y1="130" x2="216" y2="160"/>
    <line x1="256" y1="130" x2="296" y2="160"/>
    <!-- Signal waves -->
    <path d="M160 110 Q140 130 160 150" stroke-width="10" opacity="0.7"/>
    <path d="M130 90 Q100 130 130 170" stroke-width="10" opacity="0.4"/>
    <path d="M352 110 Q372 130 352 150" stroke-width="10" opacity="0.7"/>
    <path d="M382 90 Q412 130 382 170" stroke-width="10" opacity="0.4"/>
  </g>
</svg>
