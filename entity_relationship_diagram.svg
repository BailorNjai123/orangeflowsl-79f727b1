<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <style>
      .t{font-size:24px;font-weight:700;fill:#0f172a}
      .th{font-size:14px;font-weight:700;fill:#fff}
      .col{font-size:12px;fill:#0f172a}
      .pk{font-weight:700;fill:#c2410c}
      .fk{font-style:italic;fill:#4338ca}
      .ent{fill:#fff;stroke:#334155;stroke-width:1.5;rx:6;ry:6}
      .hdr{fill:#0f172a}
      .rel{stroke:#334155;stroke-width:1.6;fill:none}
      .lbl{font-size:11px;fill:#475569}
    </style>
  </defs>
  <rect width="1200" height="780" fill="#fff"/>
  <text class="t" x="600" y="36" text-anchor="middle">OrangeFlow — Entity Relationship Diagram (Crow's Foot)</text>

  <!-- profiles -->
  <g>
    <rect class="ent" x="60" y="90" width="240" height="180"/>
    <rect class="hdr" x="60" y="90" width="240" height="30" rx="6"/>
    <text class="th" x="180" y="110" text-anchor="middle">profiles</text>
    <text class="col pk" x="75" y="140">PK  id (uuid)</text>
    <text class="col" x="75" y="160">user_id (uuid)</text>
    <text class="col" x="75" y="180">full_name</text>
    <text class="col" x="75" y="200">email</text>
    <text class="col" x="75" y="220">phone</text>
    <text class="col" x="75" y="240">department</text>
    <text class="col" x="75" y="260">created_at</text>
  </g>

  <!-- user_roles -->
  <g>
    <rect class="ent" x="60" y="330" width="240" height="140"/>
    <rect class="hdr" x="60" y="330" width="240" height="30" rx="6"/>
    <text class="th" x="180" y="350" text-anchor="middle">user_roles</text>
    <text class="col pk" x="75" y="380">PK  id (uuid)</text>
    <text class="col fk" x="75" y="400">FK  user_id → profiles.id</text>
    <text class="col" x="75" y="420">role (app_role)</text>
    <text class="col" x="75" y="440">created_at</text>
  </g>

  <!-- sites -->
  <g>
    <rect class="ent" x="420" y="90" width="280" height="240"/>
    <rect class="hdr" x="420" y="90" width="280" height="30" rx="6"/>
    <text class="th" x="560" y="110" text-anchor="middle">sites</text>
    <text class="col pk" x="435" y="140">PK  id (uuid)</text>
    <text class="col fk" x="435" y="160">FK  submitted_by → profiles.id</text>
    <text class="col" x="435" y="180">site_id_code</text>
    <text class="col" x="435" y="200">site_name</text>
    <text class="col" x="435" y="220">district · scope · vendor_name</text>
    <text class="col" x="435" y="240">status (pending/approved/rejected)</text>
    <text class="col" x="435" y="260">soil_test · tower_rig · on_air …</text>
    <text class="col" x="435" y="280">handover_to_vendor</text>
    <text class="col" x="435" y="300">documents_path (Storage)</text>
    <text class="col" x="435" y="320">created_at · updated_at</text>
  </g>

  <!-- procurement_submissions -->
  <g>
    <rect class="ent" x="820" y="90" width="320" height="200"/>
    <rect class="hdr" x="820" y="90" width="320" height="30" rx="6"/>
    <text class="th" x="980" y="110" text-anchor="middle">procurement_submissions</text>
    <text class="col pk" x="835" y="140">PK  id (uuid)</text>
    <text class="col fk" x="835" y="160">FK  site_id → sites.id</text>
    <text class="col fk" x="835" y="180">FK  submitted_by → profiles.id</text>
    <text class="col" x="835" y="200">9-parameter checklist fields</text>
    <text class="col" x="835" y="220">status · notes</text>
    <text class="col" x="835" y="240">supporting_docs_path</text>
    <text class="col" x="835" y="260">created_at · updated_at</text>
  </g>

  <!-- procurement_feedback -->
  <g>
    <rect class="ent" x="820" y="360" width="320" height="170"/>
    <rect class="hdr" x="820" y="360" width="320" height="30" rx="6"/>
    <text class="th" x="980" y="380" text-anchor="middle">procurement_feedback</text>
    <text class="col pk" x="835" y="410">PK  id (uuid)</text>
    <text class="col fk" x="835" y="430">FK  site_id → sites.id</text>
    <text class="col fk" x="835" y="450">FK  user_id → profiles.id</text>
    <text class="col" x="835" y="470">feedback_text</text>
    <text class="col" x="835" y="490">status</text>
    <text class="col" x="835" y="510">created_at</text>
  </g>

  <!-- activity_log -->
  <g>
    <rect class="ent" x="420" y="430" width="300" height="180"/>
    <rect class="hdr" x="420" y="430" width="300" height="30" rx="6"/>
    <text class="th" x="570" y="450" text-anchor="middle">activity_log</text>
    <text class="col pk" x="435" y="480">PK  id (uuid)</text>
    <text class="col fk" x="435" y="500">FK  actor_id → profiles.id</text>
    <text class="col" x="435" y="520">action_type</text>
    <text class="col" x="435" y="540">entity_type · entity_id</text>
    <text class="col" x="435" y="560">description</text>
    <text class="col" x="435" y="580">metadata (jsonb)</text>
    <text class="col" x="435" y="600">created_at</text>
  </g>

  <!-- Legend -->
  <g transform="translate(60,600)">
    <rect x="0" y="0" width="300" height="140" fill="#f8fafc" stroke="#cbd5e1" rx="6"/>
    <text class="th" x="10" y="22" fill="#0f172a" font-size="13">Legend (Crow's Foot)</text>
    <line x1="10" y1="45" x2="90" y2="45" stroke="#334155" stroke-width="1.6"/>
    <path d="M85,40 L95,45 L85,50 M85,45 L80,40 M85,45 L80,50" stroke="#334155" fill="none"/>
    <text class="col" x="105" y="49">One-to-Many</text>
    <line x1="10" y1="75" x2="90" y2="75" stroke="#334155" stroke-width="1.6"/>
    <circle cx="85" cy="75" r="3" fill="#fff" stroke="#334155"/>
    <text class="col" x="105" y="79">One-to-One (optional)</text>
    <text class="col pk" x="10" y="110">PK  Primary Key</text>
    <text class="col fk" x="10" y="128">FK  Foreign Key</text>
  </g>

  <!-- Relationships (crow's foot symbolic) -->
  <!-- profiles 1—1 user_roles -->
  <path class="rel" d="M180,270 L180,330"/>
  <circle cx="180" cy="295" r="3" fill="#fff" stroke="#334155"/>
  <text class="lbl" x="190" y="305">1 : 1</text>

  <!-- profiles 1—* sites (submitted_by) -->
  <path class="rel" d="M300,180 L420,180"/>
  <path d="M415,175 L425,180 L415,185 M415,180 L410,175 M415,180 L410,185" stroke="#334155" fill="none"/>
  <text class="lbl" x="330" y="172">submits</text>

  <!-- sites 1—* procurement_submissions -->
  <path class="rel" d="M700,180 L820,180"/>
  <path d="M815,175 L825,180 L815,185 M815,180 L810,175 M815,180 L810,185" stroke="#334155" fill="none"/>
  <text class="lbl" x="730" y="172">reviewed by</text>

  <!-- sites 1—* procurement_feedback -->
  <path class="rel" d="M700,290 C 760,290 760,430 820,430"/>
  <path d="M815,425 L825,430 L815,435 M815,430 L810,425 M815,430 L810,435" stroke="#334155" fill="none"/>
  <text class="lbl" x="740" y="360">receives feedback</text>

  <!-- profiles 1—* activity_log (actor_id) -->
  <path class="rel" d="M300,200 C 360,200 360,500 420,500"/>
  <path d="M415,495 L425,500 L415,505 M415,500 L410,495 M415,500 L410,505" stroke="#334155" fill="none"/>
  <text class="lbl" x="330" y="360">logs actions</text>
</svg>
